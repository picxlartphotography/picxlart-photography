<!DOCTYPE html>
<html lang="en">
<head>
<!-- [আপনার আগের কোডের সবটুকু এখানে একই থাকবে] -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DLCSJBGXZ6"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre Wedding Shoot | Picxlart</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    /* আপনার বর্তমান স্টাইল সব সেম থাকবে */
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body{ background:#0d0d0d; color:#f5f5f5; margin:0; padding-top:90px; overflow-x:hidden; -webkit-user-select:none; -moz-user-select:none; user-select:none; }
    /* Navbar, Footer, Mobile Menu - সব আগের মতোই */
    .navbar{ position:fixed; top:0; left:0; width:100%; background:rgba(10,10,10,0.92); backdrop-filter:blur(12px); display:flex; justify-content:space-between; align-items:center; padding:8px 40px; z-index:99999; border-bottom:2px solid #d4af37; }
    .nav-logo img{ height:60px; width:auto; }
    .nav-menu{ display:flex; gap:35px; align-items: center; }
    .nav-menu a{ color:#e0e0e0; text-decoration:none; font-weight:500; letter-spacing:1px; text-transform:uppercase; font-size:13px; }
    .nav-menu a:hover{ color:#d4af37; }
    .menu-toggle { display: none; color: #d4af37; font-size: 28px; cursor: pointer; }
    
    /* নতুন কাপল গ্রিড স্টাইল */
    .couple-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(350px,1fr)); gap:30px; padding:40px; max-width:1300px; margin:auto; }
    .couple-card { position:relative; overflow:hidden; border-radius:10px; cursor:pointer; background:#1a1a1a; display:block; text-decoration:none; color:white; }
    .couple-card img { width:100%; height:400px; object-fit:cover; transition:0.5s; }
    .couple-card:hover img { transform:scale(1.05); }
    .couple-info { padding:20px; text-align:center; }
    .couple-info h3 { font-size:20px; color:#d4af37; margin-bottom:5px; }

    @media(max-width:768px){ 
        .menu-toggle { display: block; }
        .nav-menu { position: fixed; top: 60px; left: 0; width: 100%; background: #111; flex-direction: column; transform: translateY(-150%); transition: 0.4s; }
        .nav-menu.active { transform: translateY(0); }
    }
    footer { text-align: center; padding: 50px; background: #080808; border-top: 1px solid #1a1a1a; }
</style>
</head>
<body>
<!-- Navbar অংশ একই থাকবে -->
<div class="navbar">
    <div class="nav-logo"><a href="/"><img src="logo.png" alt="Logo"></a></div>
    <div class="nav-menu">
        <a href="/">Home</a> <a href="/#gallery">Gallery</a> <a href="films">Films</a> <a href="packages">Packages</a> <a href="reviews">Reviews</a> <a href="/#why">Why Picxlart</a> <a href="blog">Blog</a>
    </div>
    <div class="menu-toggle" id="mobileMenuBtn">☰</div>
</div>

<h1>Pre Wedding Stories</h1>

<!-- এখানে কার্ডগুলো যোগ করুন -->
<div class="couple-grid">
    <!-- কার্ড ১ -->
    <a href="deep-sneha/" class="couple-card">
        <img src="deep-sneha-cover.jpg" alt="Deep & Sneha">
        <div class="couple-info"><h3>Deep & Sneha</h3><p>Destination Pre-wedding</p></div>
    </a>
    <!-- কার্ড ২ -->
    <a href="rahul-sneha/" class="couple-card">
        <img src="rahul-sneha-cover.jpg" alt="Rahul & Sneha">
        <div class="couple-info"><h3>Rahul & Sneha</h3><p>Kolkata Streets</p></div>
    </a>
</div>

<!-- Footer আগের মতোই -->
<footer><p>© 2026 Picxlart Photography & Events Co.</p></footer>

<script>
    // আগের মোবাইল মেনু ও সিকিউরিটি স্ক্রিপ্ট সব এখানে পেস্ট করুন
</script>
</body>
</html>
