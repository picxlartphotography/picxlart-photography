<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre Wedding Shoot | Picxlart</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body { background:#0a0a0a; color:#f5f5f5; padding-top: 100px; }

    /* Premium Gallery Layout */
    .gallery-container {
        max-width: 1300px;
        margin: 0 auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        font-size: 40px;
        color: #d4af37;
        letter-spacing: 5px;
        text-transform: uppercase;
        margin-bottom: 50px;
        font-weight: 300;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
        gap: 25px;
    }

    .gallery-item {
        overflow: hidden;
        background: #111;
        aspect-ratio: 3/2; /* ছবির অনুপাত ঠিক রাখার জন্য */
    }

    .gallery img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease, filter 0.6s ease;
        cursor: pointer;
        filter: grayscale(20%);
    }

    .gallery img:hover {
        transform: scale(1.05);
        filter: grayscale(0%);
    }

    /* Navbar remains similar but polished */
    .navbar { position:fixed; top:0; width:100%; background:rgba(10,10,10,0.95); display:flex; justify-content:space-between; align-items:center; padding:15px 50px; z-index:999; border-bottom:1px solid #222; }
    .nav-logo img { height:50px; }
    
    .nav-menu { display:flex; gap:30px; }
    .nav-menu a { color:#fff; text-decoration:none; font-size:12px; letter-spacing:2px; text-transform:uppercase; transition:0.3s; }
    .nav-menu a:hover { color:#d4af37; }

    /* Lightbox */
    #lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); justify-content:center; align-items:center; z-index:9999; }
    #lightbox img { max-width:90%; max-height:85%; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

    @media(max-width:768px){
        .gallery { grid-template-columns: 1fr; gap: 15px; }
        .navbar { padding: 15px 20px; }
    }
</style>
</head>

<body>

<div class="navbar">
   <div class="nav-logo"><a href="/"><img src="logo.png" alt="Logo"></a></div>
   <div class="nav-menu">
       <a href="/">Home</a>
       <a href="/#gallery">Gallery</a>
       <a href="films">Films</a>
       <a href="packages">Packages</a>
   </div>
</div>

<div class="gallery-container">
    <h1>Pre Wedding</h1>
    <div class="gallery" id="imageGallery">
        <!-- আপনার ২৫টি ইমেজ -->
        <div class="gallery-item"><img src="PreWedding1.jpg" alt="Photo"></div>
        <div class="gallery-item"><img src="PreWedding2.jpg" alt="Photo"></div>
        <div class="gallery-item"><img src="PreWedding3.jpg" alt="Photo"></div>
        <div class="gallery-item"><img src="PreWedding4.jpg" alt="Photo"></div>
        <div class="gallery-item"><img src="PreWedding5.jpg" alt="Photo"></div>
        <!-- বাকি ইমেজগুলো এভাবে বসিয়ে দিন -->
    </div>
</div>

<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="View">
</div>

<script>
    const images = document.querySelectorAll('.gallery img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    images.forEach(img => {
        img.addEventListener('click', () => {
            lightbox.style.display = 'flex';
            lightboxImg.src = img.src;
        });
    });

    function closeLightbox(){
        lightbox.style.display = 'none';
    }
</script>

</body>
</html>
