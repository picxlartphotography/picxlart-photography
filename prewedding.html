<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahul & Sneha Pre-Wedding | Picxlart</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body { background:#0a0a0a; color:#f5f5f5; padding-top: 100px; }

    .navbar { position:fixed; top:0; left:0; width:100%; background:rgba(10,10,10,0.95); display:flex; justify-content:space-between; align-items:center; padding:15px 50px; z-index:999; border-bottom:1px solid #222; }
    .nav-logo img { height:55px; }
    .back-btn { color: #d4af37; text-decoration: none; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #d4af37; padding: 8px 16px; border-radius: 2px; transition: 0.3s; }
    .back-btn:hover { background: #d4af37; color: #000; }

    h1 { text-align: center; color: #d4af37; font-size: 36px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 10px; }
    .sub-title { text-align: center; color: #888; font-size: 14px; letter-spacing: 2px; margin-bottom: 40px; text-transform: uppercase; }

    /* গ্যালারি গ্রিড */
    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 25px;
        padding: 0 40px 60px 40px;
        max-width: 1450px;
        margin: auto;
    }

    .gallery-item {
        overflow: hidden;
        background: #121212;
        aspect-ratio: 4/5;
        border-radius: 2px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .gallery img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        cursor: pointer;
        transition: transform 0.6s ease, filter 0.6s ease;
    }

    .gallery img:hover {
        transform: scale(1.04);
    }

    /* লাইটবক্স মোড */
    #lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.96); justify-content:center; align-items:center; z-index:999999; }
    #lightbox img { max-width:92%; max-height:92vh; border-radius:3px; box-shadow:0 0 40px rgba(0,0,0,0.8); }

    footer { text-align: center; padding: 40px; background: #050505; color: #777; font-size: 13px; border-top: 1px solid #1a1a1a; }
</style>
</head>
<body>

<div class="navbar">
   <div class="nav-logo"><a href="/"><img src="../../logo.png" alt="Logo"></a></div>
   <div>
       <a href="../" class="back-btn"><i class="fas fa-arrow-left"></i> All Stories</a>
   </div>
</div>

<h1>Rahul & Sneha</h1>
<div class="sub-title">Pre-Wedding Story</div>

<!-- এই কাপলের নিজস্ব ছবির গ্যালারি -->
<div class="gallery">
    <div class="gallery-item"><img src="img1.jpg" alt="Photo 1"></div>
    <div class="gallery-item"><img src="img2.jpg" alt="Photo 2"></div>
    <div class="gallery-item"><img src="img3.jpg" alt="Photo 3"></div>
    <!-- এভাবে রাহুল-স্নেহার ২৫-৩০টি ছবি এখানে বসিয়ে দেবেন -->
</div>

<!-- ফুলস্ক্রিন লাইটবক্স -->
<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Enlarged View">
</div>

<footer>
    <p>© 2026 Picxlart Photography & Events Co. All Rights Reserved.</p>
</footer>

<script>
const images = document.querySelectorAll('.gallery img');
images.forEach(img => {
    img.addEventListener('click', () => {
        document.getElementById('lightbox').style.display='flex';
        document.getElementById('lightbox-img').src=img.src;
    });
});
function closeLightbox(){
    document.getElementById('lightbox').style.display='none';
}
</script>

</body>
</html>
