<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DLCSJBGXZ6"></script>
<script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-DLCSJBGXZ6');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abhinaba & Subhra Pre-Wedding | Picxlart</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* Global Styling */
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body{ background:#0d0d0d; color:#f5f5f5; margin:0; padding-top:90px; overflow-x:hidden; }

    /* Navbar */
    .navbar{ position:fixed; top:0; left:0; width:100%; background:rgba(10,10,10,0.92); backdrop-filter:blur(12px); display:flex; justify-content:space-between; align-items:center; padding:8px 40px; z-index:99999; border-bottom:2px solid #d4af37; }
    .nav-logo img{ height:60px; width:auto; }
    .nav-menu{ display:flex; gap:35px; align-items: center; }
    .nav-menu a{ color:#e0e0e0; text-decoration:none; font-weight:500; text-transform: uppercase; font-size: 13px; transition: 0.3s; padding: 4px 0; }
    .nav-menu a:hover{ color:#d4af37; }
    .menu-toggle { display: none; color: #d4af37; font-size: 28px; cursor: pointer; }

    /* Hero */
    .client-hero { width: 100%; height: 70vh; min-height: 400px; display: flex; justify-content: center; align-items: center; }
    .client-hero img { width: 100%; height: 100%; object-fit: cover; }

    .client-header { text-align: center; padding: 40px 20px; }
    .client-header h1 { color: #d4af37; font-size: 42px; margin-bottom: 10px; }
    .client-meta { display: flex; justify-content: center; gap: 20px; font-size: 13px; color: #a0a0a0; text-transform: uppercase; }
    .client-meta span i { color: #ff3333; margin-right: 5px; }

    /* Galleries */
    .section-title { text-align: center; color: #d4af37; font-size: 26px; margin: 40px 0; text-transform: uppercase; }
    .gallery{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 40px 40px; max-width: 1550px; margin: auto; }
    .vertical-gallery{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 0 40px 60px; max-width: 1650px; margin: auto; }
    .item { overflow: hidden; background: #000; border-radius: 4px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: pointer; }
    .item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: 0.5s; }
    .item img:hover { transform: scale(1.05); }

    /* Lightbox */
    #lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); justify-content:center; align-items:center; z-index:999999; }
    #lightbox img { max-width:90%; max-height:90vh; box-shadow:0 0 20px #000; }

    footer { text-align: center; padding: 40px; background: #080808; color: #777; font-size: 12px; }

    @media(max-width: 768px){ 
        .menu-toggle { display: block; }
        .nav-menu { display: none; position: absolute; top: 60px; left:0; width: 100%; background: #0d0d0d; flex-direction: column; padding: 20px; }
        .nav-menu.active { display: flex; }
        .gallery { grid-template-columns: 1fr; }
        .vertical-gallery { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

<div class="navbar">
   <div class="nav-logo"><a href="../../"><img src="../../logo.png" alt="Logo"></a></div>
   <div class="nav-menu" id="menu">
       <a href="../../">Home</a> <a href="../../#gallery">Gallery</a> <a href="../../packages">Packages</a>
   </div>
   <div class="menu-toggle" onclick="document.getElementById('menu').classList.toggle('active')">☰</div>
</div>

<div class="client-hero"><img src="ascover.jpg" alt="Cover"></div>
<div class="client-header">
    <h1>Abhinaba & Subhra</h1>
    <div class="client-meta"><span><i class="fas fa-map-marker-alt"></i> Kolkata</span> • <span><i class="fas fa-heart"></i> Pre-Wedding</span></div>
</div>

<div class="gallery">
    <div class="item"><img src="as1.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as2.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as3.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as4.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as5.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as6.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as7.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as8.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as9.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as10.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as11.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as12.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as13.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as14.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="as15.jpg" onclick="openLightbox(this.src)"></div>
</div>

<div class="section-title">Special Moments</div>
<div class="vertical-gallery">
    <div class="item"><img src="av1.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="av2.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="av3.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="av4.jpg" onclick="openLightbox(this.src)"></div>
    <div class="item"><img src="av5.jpg" onclick="openLightbox(this.src)"></div>
</div>

<footer>© 2026 Picxlart Photography</footer>

<div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="">
</div>

<script>
function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
}
</script>
</body>
</html>
