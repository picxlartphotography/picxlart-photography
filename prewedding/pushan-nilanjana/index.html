<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DLCSJBGXZ6"></script>

<meta charset="UTF-8">

<title>Dr. Pushan & Nilanjana Pre-Wedding | Picxlart</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body{ background:#0d0d0d; color:#f5f5f5; margin:0; padding-top:90px; overflow-x:hidden; -webkit-user-select:none; user-select:none; }

    /* Navbar */
    .navbar{ position:fixed; top:0; left:0; width:100%; background:rgba(10,10,10,0.95); backdrop-filter:blur(12px); display:flex; justify-content:space-between; align-items:center; padding:12px 50px; z-index:99999; border-bottom:2px solid #d4af37; }
    .nav-logo img{ height:55px; width:auto; }
    .nav-menu{ display:flex; gap:30px; align-items: center; }
    .nav-menu a{ color:#e0e0e0; text-decoration:none; font-weight:500; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; transition: color 0.3s; }
    .nav-menu a:hover{ color:#d4af37; }
    .menu-toggle { display: none; color: #d4af37; font-size: 28px; cursor: pointer; }

    /* Hero Cover Section */
    .client-hero { width: 100%; height: 80vh; min-height: 400px; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
    .client-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; display: block; }

    /* Header & Meta */
    .client-header { text-align: center; padding: 40px 20px 10px 20px; }
    .client-header h1 { color: #d4af37; font-size: 40px; font-weight: 500; letter-spacing: 2px; margin-bottom: 10px; }
    .client-meta { color: #a0a0a0; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }

    /* Galleries */
    .section-title { text-align: center; color: #d4af37; font-size: 24px; font-weight: 500; letter-spacing: 2px; margin: 40px 0 20px 0; text-transform: uppercase; }
    
    .horizontal-gallery{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 40px 30px 40px; max-width: 1500px; margin: auto; }
    .horizontal-item { width: 100%; aspect-ratio: 3/2; overflow: hidden; background: #151515; border-radius: 4px; cursor: pointer; }
    .horizontal-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; display: block; }
    .horizontal-item img:hover { transform: scale(1.04); }

    .vertical-gallery{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 0 40px 50px 40px; max-width: 1500px; margin: auto; }
    .vertical-item { width: 100%; aspect-ratio: 2/3; overflow: hidden; background: #151515; border-radius: 4px; cursor: pointer; }
    .vertical-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; display: block; }
    .vertical-item img:hover { transform: scale(1.04); }

    /* Lightbox Modal */
    #lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); justify-content:center; align-items:center; z-index:999999; }
    #lightbox img { max-width:90%; max-height:90vh; object-fit: contain; }

    /* Footer */
    footer { text-align: center; padding: 40px 20px; background: #080808; color: #777777; font-size: 13px; border-top: 1px solid #1a1a1a; }
    .footer-links { margin-bottom: 15px; }
    .footer-links a { color: #d4af37; text-decoration: none; margin: 0 10px; }
    .msme-text { margin-top: 15px; color: #999; font-size: 12px; line-height: 1.6; }

    /* Responsive Design */
    @media(max-width: 1100px){
        .horizontal-gallery { grid-template-columns: repeat(2, 1fr); }
        .vertical-gallery { grid-template-columns: repeat(3, 1fr); }
    }
    @media(max-width: 768px){
        .navbar{ padding: 12px 20px; }
        .menu-toggle { display: block; }
        .nav-menu { position: fixed; top: 75px; left: 0; width: 100%; background: #0d0d0d; flex-direction: column; transform: translateY(-150%); transition: transform 0.3s ease; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        .nav-menu.active { transform: translateY(0); }
        .nav-menu a { padding: 14px 0; width: 100%; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .horizontal-gallery { grid-template-columns: 1fr; padding: 0 15px; }
        .vertical-gallery { grid-template-columns: repeat(2, 1fr); padding: 0 15px; }
        .client-hero { height: 50vh; }
    }
</style>
</head>

<div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src="" alt="Lightbox View"></div>

<script>
function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').style.display = 'flex'; }
function closeLightbox(){ document.getElementById('lightbox').style.display = 'none'; }
const mobileMenuBtn = document.getElementById('mobileMenuBtn');
const navMenu = document.querySelector('.nav-menu');
mobileMenuBtn.onclick = () => { 
    navMenu.classList.toggle('active'); 
    mobileMenuBtn.textContent = navMenu.classList.contains('active') ? '✕' : '☰'; 
};
</script>
