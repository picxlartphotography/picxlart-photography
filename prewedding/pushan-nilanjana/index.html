<!DOCTYPE html>

<head>

<meta charset="UTF-8">

<title>Dr. Pushan & Nilanjana Pre-Wedding | Picxlart</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body{ background:#0d0d0d; color:#f5f5f5; margin:0; padding-top:90px; overflow-x:hidden; -webkit-user-select:none; user-select:none; }

    /* Navbar Fixed */
    .navbar{ position:fixed; top:0; left:0; width:100%; background:rgba(10,10,10,0.92); backdrop-filter:blur(12px); display:flex; justify-content:space-between; align-items:center; padding:15px 50px; z-index:99999; border-bottom:2px solid #d4af37; }
    .nav-logo img{ height:50px; }
    .nav-menu{ display:flex; gap:30px; align-items: center; }
    .nav-menu a{ color:#e0e0e0; text-decoration:none; font-weight:500; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
    .nav-menu a:hover{ color:#d4af37; }
    .menu-toggle { display: none; color: #d4af37; font-size: 28px; cursor: pointer; }

    /* Hero */
    .client-hero { width: 100%; height: 75vh; display: flex; justify-content: center; align-items: center; background: #0d0d0d; overflow: hidden; }
    .client-hero img { width: 100%; height: 100%; object-fit: cover; }

    /* Content */
    .client-header { text-align: center; padding: 40px 20px; }
    .client-header h1 { color: #d4af37; font-size: 42px; margin-bottom: 10px; }
    .client-meta { color: #a0a0a0; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 40px; }
    
    /* Gallery */
    .section-title { text-align: center; color: #d4af37; font-size: 26px; margin: 40px 0 20px 0; text-transform: uppercase; }
    .horizontal-gallery{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 40px 40px 40px; max-width: 1550px; margin: auto; }
    .horizontal-item { aspect-ratio: 3/2; cursor: pointer; overflow:hidden; }
    .horizontal-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
    .horizontal-item img:hover { transform: scale(1.05); }
    .vertical-gallery{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 0 40px 60px 40px; max-width: 1650px; margin: auto; }
    .vertical-item { aspect-ratio: 2/3; cursor: pointer; overflow:hidden; }
    .vertical-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
    .vertical-item img:hover { transform: scale(1.05); }

    /* Footer Fixed */
    footer { text-align: center; padding: 50px 20px; background: #080808; color: #777777; font-size: 13px; }
    .footer-links { margin-bottom:20px; }
    .footer-links a { color:#d4af37; text-decoration:none; margin: 0 10px; }
    .msme-text { margin-top:20px; color: #a0a0a0; font-size: 12px; }

    /* Mobile */
    @media(max-width: 768px){
        .navbar{ padding: 15px 20px; }
        .menu-toggle { display: block; }
        .nav-menu { position: fixed; top: 80px; left: 0; width: 100%; background: #0d0d0d; flex-direction: column; transform: translateY(-150%); transition: 0.4s; }
        .nav-menu.active { transform: translateY(0); }
        .nav-menu a { padding: 15px 0; width: 100%; text-align: center; border-bottom: 1px solid #222; }
        .horizontal-gallery { grid-template-columns: 1fr; }
        .vertical-gallery { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

<div class="navbar">
   <div class="nav-logo"><a href="../../"><img src="../../logo.png" alt="Logo"></a></div>
   <div class="nav-menu">
       <a href="../../">Home</a><a href="../../#gallery">Gallery</a><a href="../../films">Films</a><a href="../../packages">Packages</a><a href="../../reviews">Reviews</a><a href="../../#why">Why Picxlart</a><a href="../../blog">Blog</a>
   </div>

</div>

<div class="client-hero"><img src="pncover.jpg" alt="Couple Cover"></div>

<div class="client-header">
    <h1>Dr. Pushan & Nilanjana</h1>

</div>

<div class="horizontal-gallery">
    <img src="pn1.jpg"><img src="pn2.jpg"><img src="pn3.jpg"><img src="pn4.jpg"><img src="pn5.jpg"><img src="pn6.jpg"><img src="pn7.jpg"><img src="pn8.jpg"><img src="pn9.jpg"><img src="pn10.jpg"><img src="pn11.jpg"><img src="pn12.jpg">
</div>

        © 2026 Picxlart Photography & Events Co. All Rights Reserved.
    </div>
</footer>

<script>
    const btn = document.getElementById('mobileMenuBtn');
    const menu = document.querySelector('.nav-menu');
    btn.onclick = () => { menu.classList.toggle('active'); btn.textContent = menu.classList.contains('active') ? '✕' : '☰'; };
</script>
</body>
</html>
