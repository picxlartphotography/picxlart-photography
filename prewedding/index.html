<style>
    /* Global Base Styling */
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body{ background:#0d0d0d; color:#f5f5f5; margin:0; padding-top:90px; overflow-x:hidden; -webkit-user-select:none; user-select:none; }

    /* Top Navbar */
    .navbar{ position:fixed; top:0; left:0; width:100%; background:rgba(10,10,10,0.92); backdrop-filter:blur(12px); display:flex; justify-content:space-between; align-items:center; padding:8px 40px; z-index:99999; border-bottom:2px solid #d4af37; box-shadow:0 4px 25px rgba(0,0,0,.5); }
    .nav-logo img{ height:60px; width:auto; transition: transform 0.3s ease; }
    .nav-menu{ display:flex; gap:35px; align-items: center; }
    .nav-menu a{ color:#e0e0e0; text-decoration:none; font-weight:500; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; transition: all 0.3s ease; position: relative; padding: 4px 0; }
    .nav-menu a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1.5px; background: #d4af37; transition: width 0.3s ease; }
    .nav-menu a:hover::after, .nav-menu a.active::after { width: 100%; }
    .nav-menu a:hover, .nav-menu a.active{ color:#d4af37; text-shadow:0 0 10px rgba(212,175,55,.3); }
    .menu-toggle { display: none; color: #d4af37; font-size: 28px; font-weight: bold; cursor: pointer; z-index: 1000000; }

    /* Cards Section */
    .main-title { text-align: center; color: #d4af37; font-size: 36px; margin: 40px 0; text-transform: uppercase; }
    .cards-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 30px; padding: 0 40px 80px 40px; max-width: 1400px; margin: auto; }
    .card { background: #121212; border-radius: 6px; overflow: hidden; border: 1px solid rgba(212,175,55,0.15); transition: 0.4s; }
    .card:hover { transform: translateY(-8px); border-color: rgba(212,175,55,0.5); }
    .card-img { width: 100%; aspect-ratio: 4/3; overflow: hidden; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-content { padding: 25px 20px; text-align: center; }
    .card-content h3 { color: #d4af37; font-size: 22px; margin-bottom: 8px; }
    .card-content p { color: #a0a0a0; font-size: 13px; text-transform: uppercase; }

    /* Mobile View Responsive - Updated per your Films page structure */
    @media(max-width:768px){
        .navbar{ padding:12px 24px; }
        .menu-toggle { display: block; }
        .nav-social { display: none !important; }
        .nav-menu {
            position: fixed; top: 60px; left: 0; width: 100%;
            background: rgba(13, 13, 13, 0.97); flex-direction: column;
            gap: 0; padding: 15px 0 0 0; transform: translateY(-150%);
            transition: transform 0.4s ease-in-out; z-index: 999998;
            border-bottom: 3px solid #d4af37;
        }
        .nav-menu.active { transform: translateY(0); }
        .nav-menu a {
            font-size: 15px; color: #d4af37 !important; width: 100%;
            text-align: center; padding: 16px 0; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.1); /* Films পেজের স্টাইল */
            position: relative;
        }
        .nav-menu a::after { display: none !important; }
        .nav-menu a:last-child { border-bottom: none; padding-bottom: 22px; }
        .cards-container { grid-template-columns: 1fr; padding: 0 20px 50px 20px; }
    }
</style>
</head>

<script>
const mobileMenuBtn = document.getElementById('mobileMenuBtn');
const navMenu = document.querySelector('.nav-menu');
mobileMenuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    navMenu.classList.toggle('active');
    mobileMenuBtn.textContent = navMenu.classList.contains('active') ? '✕' : '☰';
});
</script>
