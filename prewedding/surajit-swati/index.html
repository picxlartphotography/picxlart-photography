<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body{ background:#0d0d0d; color:#f5f5f5; margin:0; padding-top:90px; overflow-x:hidden; }

    /* Navbar */
    .navbar{ position:fixed; top:0; left:0; width:100%; background:rgba(10,10,10,0.92); backdrop-filter:blur(12px); display:flex; justify-content:space-between; align-items:center; padding:8px 40px; z-index:99999; border-bottom:2px solid #d4af37; box-shadow:0 4px 25px rgba(0,0,0,.5); }
    .nav-logo img{ height:60px; width:auto; }
    .nav-menu{ display:flex; gap:30px; align-items: center; }
    .nav-menu a{ color:#e0e0e0; text-decoration:none; font-weight:500; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; transition: all 0.3s ease; padding: 4px 0; }
    .nav-menu a:hover{ color:#d4af37; }
    .nav-social{ display:flex; gap:20px; }
    .nav-social a{ color:#e0e0e0; font-size:18px; transition:all .3s ease; }
    .nav-social a:hover{ color:#d4af37; }
    .menu-toggle { display: none; color: #d4af37; font-size: 28px; cursor: pointer; }

    /* Hero */
    .client-hero { width: 100%; height: 70vh; min-height: 400px; display: flex; justify-content: center; align-items: center; background: #0d0d0d; overflow: hidden; }
    .client-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 50%; }

    /* Header */
    .client-header { text-align: center; padding: 40px 20px 20px 20px; }
    .client-header h1 { color: #d4af37; font-size: 42px; margin-bottom: 10px; }
    .client-meta { display: flex; justify-content: center; gap: 20px; color: #a0a0a0; margin-bottom: 40px; }
    
    /* Gallery */
    .section-title { text-align: center; color: #d4af37; font-size: 26px; margin: 40px 0; }
    .horizontal-gallery{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; padding: 0 40px 40px 40px; max-width: 1550px; margin: auto; }
    .horizontal-item { aspect-ratio: 4/3; overflow: hidden; background: #121212; border-radius: 4px; }
    .horizontal-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
    .vertical-gallery{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 0 40px 60px 40px; max-width: 1650px; margin: auto; }
    .vertical-item { aspect-ratio: 2/3; overflow: hidden; background: #121212; border-radius: 4px; }
    .vertical-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

    /* Footer */
    footer { text-align: center; padding: 50px 20px; background: #080808; color: #777777; font-size: 13px; border-top: 1px solid #1a1a1a; }
    .footer-links-container { margin-bottom:20px; }
    .footer-links-container a { color:#d4af37; text-decoration:none; margin: 0 10px; }
    
    @media(max-width: 768px){ .nav-social { display: none !important; } .menu-toggle { display: block; } .nav-menu { position: fixed; top: 60px; left: 0; width: 100%; background: #0d0d0d; display: none; flex-direction: column; } .nav-menu.active { display: flex; } }
</style>
</head>
<body>

<div class="navbar">

   </div>
   <div class="nav-social">
        <a href="https://www.facebook.com/picxlart/" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/picxlartindia/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.youtube.com/@Picxlart" target="_blank"><i class="fab fa-youtube"></i></a>
   </div>

</div>

<div class="client-hero"><img src="sswcover.jpg" alt="Couple Cover"></div>

    <div class="client-meta">
        <span><i class="fas fa-map-marker-alt" style="color:red;"></i> Bishnupur</span>
        <span>•</span>
        <span><i class="fas fa-heart" style="color:red;"></i> Pre-Wedding</span>
    </div>
</div>

<div class="horizontal-gallery">
    <script>for(let i=1; i<=15; i++) document.write('<div class="horizontal-item"><img src="ssw'+i+'.jpg"></div>');</script>
</div>

<div class="section-title">Special Moments</div>

<div class="vertical-gallery">

    </div>
    <p>🇮🇳 Govt. Registered MSME Enterprise | Udyam Reg. No: <span style="color: #d4af37;">UDYAM-WB-07-0069651</span></p>
    <p style="margin-top:10px;">© 2026 Picxlart Photography & Events Co. All Rights Reserved.</p>
</footer>

<script>
document.getElementById('mobileMenuBtn').onclick = () => document.querySelector('.nav-menu').classList.toggle('active');
</script>
</body>
</html>
