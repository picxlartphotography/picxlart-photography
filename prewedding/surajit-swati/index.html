<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DLCSJBGXZ6"></script>
<script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-DLCSJBGXZ6');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surajit & Swati Pre-Wedding | Picxlart</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* Global Styling */
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body{ background:#0d0d0d; color:#f5f5f5; margin:0; padding-top:90px; overflow-x:hidden; -webkit-user-select:none; user-select:none; }

    /* Navbar */
    .navbar{ position:fixed; top:0; left:0; width:100%; background:rgba(10,10,10,0.92); backdrop-filter:blur(12px); display:flex; justify-content:space-between; align-items:center; padding:8px 40px; z-index:99999; border-bottom:2px solid #d4af37; box-shadow:0 4px 25px rgba(0,0,0,.5); }
    .nav-logo img{ height:60px; width:auto; }
    .nav-menu{ display:flex; gap:30px; align-items: center; }
    .nav-menu a{ color:#e0e0e0; text-decoration:none; font-weight:500; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; transition: all 0.3s ease; position: relative; padding: 4px 0; }
    .nav-menu a:hover{ color:#d4af37; }
    .menu-toggle { display: none; color: #d4af37; font-size: 28px; cursor: pointer; z-index: 1000000; }

    /* Hero Banner */
    .client-hero { width: 100%; height: 70vh; min-height: 400px; display: flex; justify-content: center; align-items: center; background: #0d0d0d; overflow: hidden; }
    .client-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
    @media(min-width: 769px) { .client-hero img { object-position: center 50%; } }

    /* Header & Meta */
    .client-header { text-align: center; padding: 40px 20px 20px 20px; }
    .client-header h1 { color: #d4af37; font-size: 42px; font-weight: 500; letter-spacing: 3px; margin-bottom: 10px; }
    .client-meta { display: flex; justify-content: center; gap: 20px; font-size: 13px; letter-spacing: 2px; color: #a0a0a0; text-transform: uppercase; margin-bottom: 40px; }
    
    /* Galleries */
    .section-title { text-align: center; color: #d4af37; font-size: 26px; font-weight: 500; letter-spacing: 2px; margin: 40px 0 20px 0; text-transform: uppercase; }
    .horizontal-gallery{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; padding: 0 40px 40px 40px; max-width: 1550px; margin: auto; }
    .horizontal-item { overflow: hidden; background: #121212; border-radius: 4px; aspect-ratio: 2048 / 1365; box-shadow: 0 10px 30px rgba(0,0,0,0.4); cursor: pointer; }
    .horizontal-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; display: block; }
    .horizontal-item img:hover { transform: scale(1.03); }

    .vertical-gallery{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 0 40px 60px 40px; max-width: 1650px; margin: auto; }
    .vertical-item { overflow: hidden; background: #121212; border-radius: 4px; aspect-ratio: 2/3; box-shadow: 0 10px 30px rgba(0,0,0,0.4); cursor: pointer; }
    .vertical-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; display: block; }
    .vertical-item img:hover { transform: scale(1.03); }

    #lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.96); justify-content:center; align-items:center; z-index:999999; }
    #lightbox img { max-width:92%; max-height:92vh; border-radius:3px; object-fit: contain; }

    footer { text-align: center; padding: 50px 20px; background: #080808; color: #777777; font-size: 13px; border-top: 1px solid #1a1a1a; }
</style>
</head>
<body>

<div class="navbar">
   <div class="nav-logo"><a href="../../"><img src="../../logo.png" alt="Logo"></a></div>
   <div class="nav-menu">
       <a href="../../">Home</a><a href="../../#gallery">Gallery</a><a href="../../films">Films</a><a href="../../packages">Packages</a>
   </div>
   <div class="menu-toggle" id="mobileMenuBtn">☰</div>
</div>

<div class="client-hero"><img src="sswcover.jpg" alt="Couple Cover"></div>

<div class="client-header">
    <h1>Surajit & Swati</h1>
    <div class="client-meta"><span><i class="fas fa-map-marker-alt"></i> Bishnupur</span><span>•</span><span><i class="fas fa-heart"></i> Pre-Wedding</span></div>
</div>

<div class="horizontal-gallery">
    <script>for(let i=1; i<=10; i++) document.write('<div class="horizontal-item"><img src="ssw'+i+'.jpg" onclick="openLightbox(this.src)"></div>');</script>
</div>

<div class="section-title">Special Moments</div>

<div class="vertical-gallery">
    <script>for(let i=1; i<=5; i++) document.write('<div class="vertical-item"><img src="sswr'+i+'.jpg" onclick="openLightbox(this.src)"></div>');</script>
</div>

<footer>© 2026 Picxlart Photography & Events Co. All Rights Reserved.</footer>

<div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src="" alt="View"></div>

<script>
function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').style.display = 'flex'; }
function closeLightbox(){ document.getElementById('lightbox').style.display = 'none'; }
document.getElementById('mobileMenuBtn').onclick = () => document.querySelector('.nav-menu').classList.toggle('active');
</script>
</body>
</html>
