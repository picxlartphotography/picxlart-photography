<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picxlart Photography & Events Co.</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
    /* Global Reset & Base Typography */
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins', sans-serif;
    }
    
    body{
        background:#0d0d0d;
        color:#f5f5f5;
        overflow-x:hidden;
        -webkit-user-select:none;
        -moz-user-select:none;
        -ms-user-select:none;
        user-select:none;
    }

    /* Custom Premium Animated Splash Screen Overlay Styles */
    #picxlart-preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #080808;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999999;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), visibility 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .loader-content {
        text-align: center;
        padding: 0 20px;
        transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .intro-welcome-text {
        font-size: 20px;
        font-weight: 400;
        color: #d4af37;
        letter-spacing: 4px;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(10px);
        animation: introFadeInText 1.5s forwards ease-in-out;
    }

    .intro-brand-logo {
        max-width: 580px; 
        width: 100%;
        height: auto;
        margin-top: 15px;
        margin-bottom: 15px;
        opacity: 0;
        transform: scale(0.93);
        animation: introFadeInLogo 1.8s forwards ease-in-out;
        animation-delay: 0.3s;
        filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.6));
    }

    .intro-tagline-text {
        font-size: 14px;
        font-weight: 300;
        color: #dfdfdf;
        letter-spacing: 4px;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(-10px);
        animation: introFadeInText 1.8s forwards ease-in-out;
        animation-delay: 0.6s;
    }

    @keyframes introFadeInText {
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes introFadeInLogo {
        to { opacity: 1; transform: scale(1); }
    }

    /* Popup Modal Styles */
    #popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999999;
        padding: 20px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #popup-overlay.show-popup {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }
    .popup-content {
        background: #141414;
        width: 100%;
        max-width: 680px;
        border: 1px solid #d4af37;
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        transform: scale(0.92);
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #popup-overlay.show-popup .popup-content {
        transform: scale(1);
    }
    .popup-slideshow {
        width: 100%;
        height: 300px;
        position: relative;
        overflow: hidden;
    }
    .popup-slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        visibility: hidden;
        transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
    }
    .popup-slide.active-slide {
        opacity: 1;
        visibility: visible;
    }
    .popup-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
    }
    .popup-form {
        padding: 25px 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        align-items: center;
    }
    .popup-form-full {
        grid-column: span 2;
        text-align: center;
        margin-top: 5px;
    }
    .popup-close {
        position: absolute;
        top: 12px;
        right: 15px;
        color: #fff;
        background: rgba(0,0,0,0.7);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        cursor: pointer;
        z-index: 10;
        transition: background 0.3s ease;
    }
    .popup-close:hover {
        background: #d4af37;
        color: #000;
    }
    .popup-form input, 
    .popup-form select {
        background: rgba(15, 15, 15, 0.9);
        color: #999;
        border: 1px solid #3a3a3a;
        padding: 12px 18px;
        font-size: 13px;
        font-weight: 400; 
        border-radius: 25px;
        outline: none;
        width: 100%;
        appearance: none;
    }
    .popup-form select {
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 18px center;
        background-size: 14px;
        cursor: pointer;
    }
    .popup-form input::placeholder {
        color: #999;
        font-weight: 400;
    }
    .popup-form select option {
        background: #111;
        color: white;
    }
    .popup-form input:focus, 
    .popup-form select:focus {
        border-color: #d4af37;
        box-shadow: 0 0 8px rgba(212,175,55,0.3);
        color: white;
    }
    .popup-submit-btn {
        background: linear-gradient(135deg, #d4af37, #b38f2d);
        color: #000000;
        border: none;
        padding: 10px 35px;
        border-radius: 25px;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-block;
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
    }
    .popup-submit-btn:hover {
        background: #ffffff;
        color: #000000;
        box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
    }

    /* Top Navbar Layout & Styling */
    .navbar{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        background:rgba(10,10,10,0.92);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 40px;
        z-index:99999;
        border-bottom:2px solid #d4af37;
        box-shadow:0 4px 25px rgba(0,0,0,.5);
        overflow:visible !important;
    }

    .nav-logo img{
        height:60px;
        width:auto;
        transition: transform 0.3s ease;
    }
    
    .nav-logo img:hover {
        transform: scale(1.03);
    }

    .nav-logo a{
        -webkit-tap-highlight-color: transparent;
    }
        
    .nav-menu{
        display:flex;
        gap:35px;
        align-items: center;
    }

    .nav-menu a{
        color:#e0e0e0;
        text-decoration:none;
        font-weight:500;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-size: 13px;
        transition: all 0.3s ease;
        position: relative;
        padding: 4px 0;
    }

    .nav-menu a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 1.5px;
        background: #d4af37;
        transition: width 0.3s ease;
    }

    .nav-menu a:hover::after {
        width: 100%;
    }

    .nav-menu a:hover{
        color:#d4af37;
        text-shadow:0 0 10px rgba(212,175,55,.3);
    }

    .nav-social{
        display:flex;
        gap:20px;
    }

    .nav-social a{
        color:#e0e0e0;
        text-decoration:none;
        font-size:18px;
        transition:all .3s ease;
    }

    .nav-social a:hover{
        color:#d4af37;
        transform:translateY(-3px);
    }

    .menu-toggle {
        display: none;
        color: #d4af37;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        z-index: 1000000;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    .navbar::after{
        content:'';
        position:absolute;
        bottom:0;
        left:-180px;
        width:180px;
        height:2px;
        background:linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
        opacity:0;
    }

    .navbar.shine::after{
        animation:goldSweep 1.2s ease forwards;
    }

    @keyframes goldSweep{
        0%{ left:-180px; opacity:1; }
        100%{ left:100%; opacity:1; }
    }

    /* Hero Section */
    .hero{
        margin-top:60px;
        height: calc(100vh - 60px);
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: flex-end; 
        text-align: center;
        padding: 0 20px 80px; 
    }

    .hero-slideshow {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .hero-slideshow::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.70));
        z-index: 2;
    }

    .mySlides {
        display: none;
        width: 100%;
        height: 100%;
    }

    .mySlides img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .hero-content {
        position: relative;
        z-index: 3;
        max-width: 900px;
        animation: fadeInUp 1.4s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .hero-brand-logo {
        max-width: 580px; 
        width: 100%;
        height: auto;
        margin-top: 15px;
        margin-bottom: 5px; 
        filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.6));
    }

    .hero-title span {
        display: block;
        font-size: 28px; 
        font-weight: 700; 
        letter-spacing: 2px;
        color: #d4af37;
        text-transform: uppercase;
        margin-top: 8px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .hero-content p{
        font-size: 18px;
        font-weight: 300;
        letter-spacing: 4px;
        margin-top: 20px;
        margin-bottom: 40px;
        color: #dfdfdf;
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .btn{
        background: linear-gradient(135deg, #d4af37, #b38f2d);
        color: #000000;
        padding: 15px 42px;
        text-decoration:none;
        font-weight:700;
        font-size: 14px;
        border-radius:50px;
        display: inline-block;
        border: none;
        cursor: pointer;
        letter-spacing: 2px;
        text-transform: uppercase;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    }

    .btn:hover{
        transform: translateY(-4px);
        box-shadow: 0 8px 30px rgba(212, 175, 55, 0.6);
        background: linear-gradient(135deg, #f4d06f, #d4af37);
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Sections Layout */
    section{
        padding:90px 10%;
    }

    h2{
        text-align:center;
        margin-bottom:50px;
        color:#d4af37;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        position: relative;
    }
    
    h2::after {
        content: '';
        display: block;
        width: 60px;
        height: 2px;
        background: #d4af37;
        margin: 15px auto 0;
    }

    /* Modern Services Matrix Layout */
    .services{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
        gap:25px;
    }

    .card{
        background: rgba(28, 28, 28, 0.6);
        padding: 40px 30px;
        border-radius: 15px;
        text-align: center;
        transition: all 0.4s ease;
        min-height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(6px);
    }
        
    .card h3{
        color:#d4af37;
        font-size: 20px;
        margin-bottom: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .card p {
        font-size: 14px;
        color: #b0b0b0;
        line-height: 1.5;
    }

    .card:hover{
        transform:translateY(-8px);
        background: rgba(35, 35, 35, 0.9);
        border-color: rgba(212, 175, 55, 0.4);
        box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    /* Side-by-Side Why Picxlart Layout with 6 Grunge/Brush-Stroke Photos on Left */
    .why-section-container {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 40px;
        align-items: center;
        max-width: 1280px;
        margin: 0 auto;
    }

    .why-photos-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }

    .why-photo-item {
        width: 100%;
        height: 195px;
        overflow: hidden;
        /* ব্রাশ স্ট্রোক / গ্রাঞ্জ কাটিং ফ্রেম (Organic Paint Stroke Clip-path) */
        clip-path: polygon(2% 4%, 96% 1%, 99% 95%, 4% 99%);
        border: 3px solid rgba(212, 175, 55, 0.5);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        background: #111;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .why-photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
    }

    .why-photo-item:hover {
        border-color: #f4d06f;
        transform: translateY(-5px) scale(1.03);
        box-shadow: 0 15px 35px rgba(212, 175, 55, 0.3);
    }

    .why-photo-item:hover img {
        transform: scale(1.08);
    }

    /* Brand Story Box Layout */
    .why-card{
        width:100%;
        margin:0;
        padding:45px 40px;
        text-align:center;
        background:#141414;
        border:1px solid rgba(212,175,55,.15);
        border-radius:20px;
        box-shadow:0 20px 50px rgba(0,0,0,.5);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .why-card h2 {
        font-size: 28px;
        margin-bottom: 25px;
    }

    .why-card p{
        margin-bottom:20px;
        font-size:15px;
        line-height:1.8;
        color:#e0e0e0;
        text-align: justify;
    }
    
    .why-card p strong {
        color: #d4af37;
        font-weight: 600;
    }

    #seeMoreBtn{
        display:inline-block;
        margin-top:10px;
        background:#d4af37;
        color:#111;
        border:none;
        padding:12px 35px;
        border-radius:30px;
        font-weight:700;
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor:pointer;
        width: 180px; 
        margin-left: auto;
        margin-right: auto;
    }

    #seeMoreBtn:hover{
        transform:translateY(-3px);
        box-shadow:0 6px 20px rgba(212,175,55,.4);
        background: #f4d06f;
    }

    /* Infinite Marquee Album Strip (Larger Images, No Card Background, Rig Biswas Style Heading) */
    .achievements-marquee-section {
        padding: 60px 0;
        background: #0d0d0d;
        overflow: hidden;
        border-top: 1px solid rgba(212,175,55,0.15);
        border-bottom: 1px solid rgba(212,175,55,0.15);
        margin: 30px 0;
        text-align: center;
    }
    .marquee-intro-title {
        color: #ffffff;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 12px;
    }
    .marquee-main-title {
        color: #d4af37;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 45px;
        line-height: 1.3;
    }
    .marquee-track {
        display: flex;
        width: max-content;
        animation: scrollMarquee 45s linear infinite;
        gap: 30px;
    }
    .marquee-track:hover { animation-play-state: paused; }
    
    .album-marquee-img-box {
        width: 450px;
        height: 300px;
        flex-shrink: 0;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        display: block;
        text-decoration: none;
    }
    .album-marquee-img-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
    }
    .album-marquee-img-box:hover img {
        transform: scale(1.04);
    }

    @keyframes scrollMarquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* Social Ecosystem Section */
    .social-visit-title {
        text-align:center;
        color:#d4af37;
        margin-top:20px;
        font-size:28px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .social-buttons-container {
        text-align
