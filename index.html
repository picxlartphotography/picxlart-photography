<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picxlart Photography & Events Co.</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
    /* Global Reset & Base Typography */
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body{ background:#0d0d0d; color:#f5f5f5; overflow-x:hidden; -webkit-user-select:none; user-select:none; }

    /* Custom Premium Animated Splash Screen */
    #picxlart-preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #080808; display: flex; justify-content: center; align-items: center; z-index: 999999; opacity: 1; visibility: visible; transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), visibility 1.2s cubic-bezier(0.25, 1, 0.5, 1); }
    .loader-content { text-align: center; padding: 0 20px; transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1); }
    .intro-welcome-text { font-size: 20px; font-weight: 400; color: #d4af37; letter-spacing: 4px; text-transform: uppercase; opacity: 0; transform: translateY(10px); animation: introFadeInText 1.5s forwards ease-in-out; }
    .intro-brand-logo { max-width: 580px; width: 100%; height: auto; margin-top: 15px; margin-bottom: 15px; opacity: 0; transform: scale(0.93); animation: introFadeInLogo 1.8s forwards ease-in-out; animation-delay: 0.3s; filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.6)); }
    .intro-tagline-text { font-size: 14px; font-weight: 300; color: #dfdfdf; letter-spacing: 4px; text-transform: uppercase; opacity: 0; transform: translateY(-10px); animation: introFadeInText 1.8s forwards ease-in-out; animation-delay: 0.6s; }
    @keyframes introFadeInText { to { opacity: 1; transform: translateY(0); } }
    @keyframes introFadeInLogo { to { opacity: 1; transform: scale(1); } }
    #picxlart-preloader.fade-out { opacity: 0; visibility: hidden; }
    
    /* Popup Modal Styles */
    #popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999999; }
    .popup-content { background: #141414; width: 90%; max-width: 500px; border: 1px solid #d4af37; border-radius: 15px; position: relative; overflow: hidden; }
    .popup-img { width: 100%; height: 200px; object-fit: cover; }
    .popup-form { padding: 30px; display: flex; flex-direction: column; gap: 15px; }
    .popup-close { position: absolute; top: 10px; right: 15px; color: #d4af37; font-size: 24px; cursor: pointer; }
    .popup-form input, .popup-form select { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; }
    .popup-form button { background: #d4af37; color: #000; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }

    /* Top Navbar Layout */
    .navbar{ position:fixed; top:0; left:0; width:100%; background:rgba(10,10,10,0.92); backdrop-filter:blur(12px); display:flex; justify-content:space-between; align-items:center; padding:8px 40px; z-index:99999; border-bottom:2px solid #d4af37; box-shadow:0 4px 25px rgba(0,0,0,.5); }
    .nav-logo img{ height:60px; width:auto; transition: transform 0.3s ease; }
    .nav-logo img:hover { transform: scale(1.03); }
    .nav-menu{ display:flex; gap:35px; align-items: center; }
    .nav-menu a{ color:#e0e0e0; text-decoration:none; font-weight:500; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; transition: all 0.3s ease; position: relative; padding: 4px 0; }
    .nav-menu a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1.5px; background: #d4af37; transition: width 0.3s ease; }
    .nav-menu a:hover::after { width: 100%; }
    .nav-menu a:hover{ color:#d4af37; text-shadow:0 0 10px rgba(212,175,55,.3); }
    .nav-social{ display:flex; gap:20px; }
    .nav-social a{ color:#e0e0e0; text-decoration:none; font-size:18px; transition:all .3s ease; }
    .nav-social a:hover{ color:#d4af37; transform:translateY(-3px); }
    .menu-toggle { display: none; color: #d4af37; font-size: 28px; font-weight: bold; cursor: pointer; z-index: 1000000; }

    /* Hero & Other Sections same as before */
    .hero{ margin-top:60px; height: calc(100vh - 60px); position: relative; overflow: hidden; display: flex; justify-content: center; align-items: flex-end; text-align: center; padding: 0 20px 80px; }
    .hero-slideshow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .hero-slideshow::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.70)); z-index: 2; }
    .mySlides { display: none; width: 100%; height: 100%; }
    .mySlides img { width: 100%; height: 100%; object-fit: cover; }
    .hero-content { position: relative; z-index: 3; max-width: 900px; animation: fadeInUp 1.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; align-items: center; }
    .hero-brand-logo { max-width: 580px; width: 100%; height: auto; margin-top: 15px; margin-bottom: 5px; filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.6)); }
    .hero-title span { display: block; font-size: 28px; font-weight: 700; letter-spacing: 2px; color: #d4af37; text-transform: uppercase; margin-top: 8px; }
    .hero-content p{ font-size: 18px; font-weight: 300; letter-spacing: 4px; margin-top: 20px; margin-bottom: 40px; color: #dfdfdf; text-transform: uppercase; }
    .btn{ background: linear-gradient(135deg, #d4af37, #b38f2d); color: #000000; padding: 15px 42px; text-decoration:none; font-weight:700; font-size: 14px; border-radius:50px; display: inline-block; border: none; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35); }
    .btn:hover{ transform: translateY(-4px); box-shadow: 0 8px 30px rgba(212, 175, 55, 0.6); }

    /* Responsive */
    @media(max-width:768px){
        .navbar{ padding:12px 24px; }
        .menu-toggle { display: block; }
        .nav-social { display: none !important; }
        .nav-menu { position: fixed; top: 60px; left: 0; width: 100%; background: rgba(13, 13, 13, 0.97); flex-direction: column; align-items: center; padding: 15px 0 0 0; transform: translateY(-150%); transition: transform 0.4s ease-in-out; z-index: 999998; border-bottom: 3px solid #d4af37; }
        .nav-menu.active { transform: translateY(0); }
        .nav-menu a { width: 100%; text-align: center; padding: 16px 0; color: #d4af37 !important; border-bottom: 1px solid rgba(212, 175, 55, 0.1); }
        .nav-menu a::after { display: none !important; }
    }
</style>
</head>
<body>

<!-- Preloader -->
<div id="picxlart-preloader">
    <div class="loader-content">
        <div class="intro-welcome-text">Welcome to</div>
        <img src="hero-logo.png" alt="Picxlart Logo" class="intro-brand-logo">
        <div class="intro-tagline-text">Timeless Moments, Captured For Eternity</div>
    </div>
</div>

<!-- Popup Modal -->
<div id="popup-overlay">
    <div class="popup-content">
        <span class="popup-close" onclick="closePopup()">×</span>
        <img src="Cover.jpg" alt="Popup Image" class="popup-img">
        <div class="popup-form">
            <h3 style="color:#d4af37; text-align:center;">Book Your Shoot</h3>
            <input type="text" id="pName" placeholder="Your Name">
            <input type="tel" id="pPhone" placeholder="WhatsApp Number">
            <select id="pType">
                <option value="Wedding">Wedding Photography</option>
                <option value="Pre-Wedding">Pre-Wedding Shoot</option>
            </select>
            <button onclick="submitPopup()">Submit Enquiry</button>
        </div>
    </div>
</div>

<div class="navbar">
   <div class="nav-logo"><a href="/" id="logoLink"><img src="logo.png" alt="Logo"></a></div>
   <div class="nav-menu">
       <a href="/">Home</a><a href="#gallery">Gallery</a><a href="films">Films</a><a href="packages">Packages</a><a href="reviews">Reviews</a><a href="#why">Why Picxlart</a><a href="blog">Blog</a><a href="login">Login</a>
   </div>
   <div class="nav-social">
        <a href="https://www.facebook.com/picxlart/" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/picxlartindia/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.youtube.com/@Picxlart" target="_blank"><i class="fab fa-youtube"></i></a>
   </div>
   <div class="menu-toggle" id="mobileMenuBtn">☰</div>
</div>

<!-- Rest of your content -->
<div class="hero">
    <div class="hero-slideshow">
        <div class="mySlides fade"><img src="Cover.jpg" alt="Cover 1"></div>
        <div class="mySlides fade"><img src="Cover1.jpg" alt="Cover 2"></div>
    </div>
    <div class="hero-content">
        <img src="hero-logo.png" alt="Picxlart" class="hero-brand-logo">
        <span>PHOTOGRAPHY & EVENTS CO.</span>
        <p>Timeless Moments, Captured for Eternity</p>
        <a href="login" class="btn">Book Now</a>
    </div>
</div>

<script>
    // Preloader
    window.addEventListener('load', function() {
        setTimeout(() => document.getElementById('picxlart-preloader').classList.add('fade-out'), 2000);
        // Popup trigger after 5 seconds
        setTimeout(() => document.getElementById('popup-overlay').style.display = 'flex', 5000);
    });

    function closePopup() { document.getElementById('popup-overlay').style.display = 'none'; }

    function submitPopup() {
        const name = document.getElementById('pName').value;
        const phone = document.getElementById('pPhone').value;
        const type = document.getElementById('pType').value;
        const msg = `Website Enquiry - Hello! I am ${name}. Interested in ${type}. My phone: ${phone}`;
        window.open(`https://wa.me/917003521139?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Existing scripts (Toggle, Slideshow, etc.)
    let slideIndex = 0;
    function showSlides() {
        let slides = document.getElementsByClassName("mySlides");
        for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
        slideIndex++;
        if (slideIndex > slides.length) slideIndex = 1;
        slides[slideIndex-1].style.display = "block";
        setTimeout(showSlides, 3500);
    }
    showSlides();

    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
        document.querySelector('.nav-menu').classList.toggle('active');
    });
</script>
</body>
</html>
