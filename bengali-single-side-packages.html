<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengali Single Side Wedding | Picxlart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background:#0d0d0d; color:#f5f5f5; padding-top: 100px; text-align: center; }
        h1 { color: #d4af37; margin-bottom: 50px; text-transform: uppercase; letter-spacing: 2px; }
        
        .selection-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; max-width: 900px; margin: 0 auto; padding: 20px; }
        .select-card { background: rgba(28, 28, 28, 0.4); border: 1px solid #d4af37; padding: 30px; border-radius: 20px; text-decoration: none; transition: 0.4s; color: white; }
        .select-card:hover { transform: translateY(-10px); background: #1a1a1a; }
        .card-img-holder { width: 100%; aspect-ratio: 16/9; background: #222; margin-bottom: 15px; border-radius: 10px; }
        
        @media(max-width:768px) { .selection-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <h1>SELECT CATEGORY</h1>
    <div class="selection-grid">
        <!-- Groom Side -->
        <a href="groom-side-packages" class="select-card">
            <div class="card-img-holder"></div>
            <h3>Bengali Groom Side Wedding</h3>
        </a>
        <!-- Bride Side -->
        <a href="bride-side-packages" class="select-card">
            <div class="card-img-holder"></div>
            <h3>Bengali Bride Side Wedding</h3>
        </a>
    </div>

</body>
</html>
