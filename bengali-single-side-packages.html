<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengali Single Side Wedding | Picxlart</title>
    <!-- আপনার আগের পেজের স্টাইল ও ফন্ট লিঙ্কগুলো এখানে একইভাবে রাখুন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* আপনার মেইন ওয়েবসাইটের CSS গুলো এখানে বসাবেন */
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body{ background:#0d0d0d; color:#f5f5f5; padding-top: 100px; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Navbar & Footer (মেইন পেজ থেকে কপি করে নেবেন) */
        .navbar{ position:fixed; top:0; width:100%; background:rgba(10,10,10,0.95); display:flex; justify-content:space-between; align-items:center; padding:15px 40px; border-bottom:2px solid #d4af37; z-index:999; }
        footer { margin-top: auto; padding: 50px; text-align: center; color: #777; border-top: 1px solid #222; }

        /* নতুন কার্ডের স্টাইল */
        .container { flex: 1; padding: 50px 20px; text-align: center; }
        h1 { color: #d4af37; margin-bottom: 50px; text-transform: uppercase; }
        .selection-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; max-width: 900px; margin: 0 auto; }
        .select-card { background: #1a1a1a; border: 1px solid #d4af37; padding: 30px; border-radius: 20px; text-decoration: none; color: white; transition: 0.4s; }
        .select-card:hover { transform: translateY(-10px); background: #222; }
    </style>
</head>
<body>

    <!-- হেডার (মেইন পেজ থেকে কপি করা) -->
    <div class="navbar">
       <div class="nav-logo"><a href="/"><img src="logo.png" alt="Logo" style="height:50px;"></a></div>
       <div class="nav-menu">
           <a href="/">Home</a>
           <a href="/#gallery">Gallery</a>
           <a href="packages">Packages</a>
           <a href="blog">Blog</a>
           <a href="login">Login</a>
       </div>
    </div>

    <div class="container">
        <h1>SELECT CATEGORY</h1>
        <div class="selection-grid">
            <a href="groom-side-packages" class="select-card">
                <h3>Bengali Groom Side Wedding</h3>
            </a>
            <a href="bride-side-packages" class="select-card">
                <h3>Bengali Bride Side Wedding</h3>
            </a>
        </div>
    </div>

    <!-- ফুটার (মেইন পেজ থেকে কপি করা) -->
    <footer>
        <p>© 2026 Picxlart Photography & Events Co. All Rights Reserved.</p>
    </footer>

</body>
</html>
