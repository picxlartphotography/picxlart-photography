<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Login - Picxlart</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #1a1a1e;
            border: 1px solid #2a2a30;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Boro Logo Configuration */
        .brand-logo-img {
            height: 90px; /* লোগোর সাইজ বাড়িয়ে ৯০px করা হলো */
            width: auto;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 14px;
            color: #a0a0ab;
            margin-bottom: 25px;
        }

        .btn-google {
            width: 100%;
            background-color: #ffffff;
            color: #222222;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .btn-google:hover {
            background-color: #e6e6e6;
        }

        .divider {
            display: flex;
            align-items: center;
            color: #666;
            margin: 20px 0;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #333;
        }

        .divider span {
            padding: 0 10px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0f0f11;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #d4af37;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .toggle-text {
            margin-top: 20px;
            font-size: 13px;
            color: #aaa;
        }

        .toggle-text a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
        }

        /* Status Alert Box */
        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-warning {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            color: #d4af37;
        }

        .alert-danger {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Boro Logo Image -->
        <img src="logo.png" alt="Picxlart Logo" class="brand-logo-img">
        <p class="subtitle" id="page-subtitle">Client Portal Access</p>

        <!-- Alert Notification Box -->
        <div id="alert-box" class="alert"></div>

        <!-- Google Login Button -->
        <button class="btn-google" id="google-login-btn">
            <i class="fa-brands fa-google" style="color: #ea4335; font-size: 18px;"></i>
            Continue with Google
        </button>

        <div class="divider"><span>OR</span></div>

        <!-- Custom Email Form -->
        <form id="auth-form">
            <div class="input-group" id="name-field" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="user-name" placeholder="Enter your full name">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="user-email" placeholder="example@gmail.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="user-password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Login</button>
        </form>

        <div class="toggle-text">
            <span id="toggle-msg">Don't have an account?</span> 
            <a href="#" id="toggle-btn">Sign Up</a>
        </div>
    </div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAGXrHusoIE1Alp9gqUDwCNg4mdba4s7uo",
            authDomain: "picxlart-portal.firebaseapp.com",
            projectId: "picxlart-portal",
            storageBucket: "picxlart-portal.firebasestorage.app",
            messagingSenderId: "993916901139",
            appId: "1:993916901139:web:55d481ca4cf6fb61fdece6",
            measurementId: "G-86G1EFCWB7"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // UI Elements
        let isSignUp = false;
        const toggleBtn = document.getElementById('toggle-btn');
        const toggleMsg = document.getElementById('toggle-msg');
        const submitBtn = document.getElementById('submit-btn');
        const pageSubtitle = document.getElementById('page-subtitle');
        const nameField = document.getElementById('name-field');
        const alertBox = document.getElementById('alert-box');
        const authForm = document.getElementById('auth-form');
        const googleBtn = document.getElementById('google-login-btn');

        // Toggle Login / Sign Up UI
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isSignUp = !isSignUp;
            showAlert("", ""); // Clear alerts

            if (isSignUp) {
                pageSubtitle.innerText = "Create Your Client Account";
                submitBtn.innerText = "Sign Up";
                toggleMsg.innerText = "Already have an account?";
                toggleBtn.innerText = "Login";
                nameField.style.display = "block";
            } else {
                pageSubtitle.innerText = "Client Portal Access";
                submitBtn.innerText = "Login";
                toggleMsg.innerText = "Don't have an account?";
                toggleBtn.innerText = "Sign Up";
                nameField.style.display = "none";
            }
        });

        // Show Alert Box
        function showAlert(message, type) {
            if (!message) {
                alertBox.style.display = "none";
                return;
            }
            alertBox.innerText = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = "block";
        }

        // Email / Password Submit Action
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('user-email').value;
            const password = document.getElementById('user-password').value;
            const name = document.getElementById('user-name').value;

            try {
                if (isSignUp) {
                    // Create New User
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    if (name) {
                        await updateProfile(userCredential.user, { displayName: name });
                    }
                    showAlert("Registration successful! Your account is pending admin approval. Please wait for confirmation.", "warning");
                } else {
                    // Login Existing User
                    await signInWithEmailAndPassword(auth, email, password);
                    showAlert("Your account is pending admin approval. Please wait for confirmation.", "warning");
                }
            } catch (error) {
                showAlert(error.message.replace("Firebase: ", ""), "danger");
            }
        });

        // Google Sign-In Action
        googleBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                showAlert("Your account is pending admin approval. Please wait for confirmation.", "warning");
            } catch (error) {
                showAlert(error.message.replace("Firebase: ", ""), "danger");
            }
        });
    </script>
</body>
</html>
