<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - Picxlart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #0b0b0d; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Background 3-Line Seamless Marquee Animation (Gap completely removed, Height increased) */
        .bg-marquee-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* কোনো এক্সট্রা গ্যাপ না রেখে স্ক্রিন জুড়ে সমানভাবে ছড়ানোর জন্য */
            overflow: hidden;
            z-index: 1;
            opacity: 0.38;
        }

        .marquee-row {
            display: flex;
            width: max-content;
            will-change: transform;
            gap: 0; 
        }

        /* Row 1: Right to Left */
        .row-1 {
            animation: scrollRightToLeft 35s linear infinite;
        }

        /* Row 2: Left to Right (Opposite) */
        .row-2 {
            animation: scrollLeftToRight 35s linear infinite;
        }

        /* Row 3: Right to Left */
        .row-3 {
            animation: scrollRightToLeft 35s linear infinite;
        }

        .marquee-img-box {
            width: 420px;
            height: 360px; /* ছবির উচ্চতা বাড়িয়ে দেওয়া হয়েছে যাতে মাঝের ফাঁকা জায়গা ঢেকে যায় */
            flex-shrink: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .marquee-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes scrollRightToLeft {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        @keyframes scrollLeftToRight {
            0% { transform: translate3d(-50%, 0, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        /* Transparent Dark Screen Overlay over Background */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 13, 0.78); /* হালকা ওভারলে যাতে ছবিগুলো পরিষ্কার বোঝা যায় */
            z-index: 2;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            background: #121215;
            border: 1px solid #d4af37;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }

        .auth-container img { height: 55px; margin-bottom: 10px; }
        .auth-container h2 { color: #d4af37; font-size: 22px; font-weight: 600; margin-bottom: 5px; }
        .auth-container p { color: #888; font-size: 13px; margin-bottom: 25px; }

        .input-group { position: relative; margin-bottom: 16px; text-align: left; }
        .input-group i.left-icon { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #d4af37; font-size: 14px; }
        .input-group i.right-icon { position: absolute; top: 50%; right: 15px; transform: translateY(-50%); color: #888; font-size: 14px; cursor: pointer; transition: color 0.3s; }
        .input-group i.right-icon:hover { color: #fff; }

        .input-group input { width: 100%; padding: 13px 40px 13px 40px; background: #0d0d0f; border: 1px solid #2a2a30; border-radius: 8px; color: #fff; font-size: 13px; transition: 0.3s; }
        .input-group input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); }
        
        .btn-main { width: 100%; background: linear-gradient(135deg, #d4af37, #aa820a); color: #000; border: none; padding: 13px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; margin-top: 5px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3); }

        .divider { margin: 20px 0; color: #555; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        .divider::before, .divider::after { content: ""; height: 1px; background: #2a2a30; flex: 1; margin: 0 10px; }

        .btn-google { width: 100%; background: #ffffff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-google:hover { background: #e0e0e0; }
        .btn-google i { color: #ea4335; font-size: 16px; }

        .toggle-link { display: block; margin-top: 25px; font-size: 12.5px; color: #aaa; cursor: pointer; transition: 0.3s; }
        .toggle-link span { color: #d4af37; font-weight: 600; }
        .toggle-link:hover { color: #fff; }

        .msg-box { font-size: 12.5px; margin-top: 15px; display: none; padding: 10px; border-radius: 6px; }
        .msg-error { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid #ff4d4d; }
        .msg-success { background: rgba(76, 175, 80, 0.1); color: #4caf50; border: 1px solid #4caf50; }

        .loader { display: none; width: 16px; height: 16px; border: 3px solid rgba(0,0,0,0.3); border-top-color: #000; border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #signup-section { display: none; }

        @media (max-width: 480px) {
            .marquee-img-box { width: 220px; height: 180px; }
        }
    </style>
</head>
<body>

    <!-- Background 3-Row Continuous Marquee Animation -->
    <div class="bg-marquee-wrapper">
        <!-- Row 1: Right to Left -->
        <div class="marquee-row row-1">
            <div class="marquee-img-box"><img src="login-bg1.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg2.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg3.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg4.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg5.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg6.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg7.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg8.jpg" alt=""></div>
            <!-- Duplicated for Infinite Loop -->
            <div class="marquee-img-box"><img src="login-bg1.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg2.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg3.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg4.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg5.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg6.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg7.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg8.jpg" alt=""></div>
        </div>

        <!-- Row 2: Left to Right (Opposite) -->
        <div class="marquee-row row-2">
            <div class="marquee-img-box"><img src="login-bg9.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg10.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg11.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg12.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg13.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg14.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg15.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg1.jpg" alt=""></div>
            <!-- Duplicated for Infinite Loop -->
            <div class="marquee-img-box"><img src="login-bg9.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg10.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg11.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg12.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg13.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg14.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg15.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg1.jpg" alt=""></div>
        </div>

        <!-- Row 3: Right to Left -->
        <div class="marquee-row row-3">
            <div class="marquee-img-box"><img src="login-bg2.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg4.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg6.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg8.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg10.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg12.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg14.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg15.jpg" alt=""></div>
            <!-- Duplicated for Infinite Loop -->
            <div class="marquee-img-box"><img src="login-bg2.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg4.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg6.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg8.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg10.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg12.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg14.jpg" alt=""></div>
            <div class="marquee-img-box"><img src="login-bg15.jpg" alt=""></div>
        </div>
    </div>

    <!-- Transparent Dark Screen Overlay -->
    <div class="bg-overlay"></div>

    <div class="auth-container">
        <img src="logo.png" alt="Picxlart Logo">
        <h2 id="form-title">Client Login</h2>
        <p id="form-subtitle">Login to track your project & payments</p>

        <div id="global-msg" class="msg-box"></div>

        <!-- LOGIN SECTION -->
        <div id="login-section">
            <form id="login-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope left-icon"></i>
                    <input type="email" id="login-email" placeholder="Registered Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock left-icon"></i>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <i class="fa-solid fa-eye right-icon" id="toggle-login-pass" title="Show Password"></i>
                </div>
                <button type="submit" class="btn-main" id="login-submit-btn">
                    <span id="login-btn-text">Secure Login</span>
                    <div class="loader" id="login-loader"></div>
                </button>
            </form>

            <div class="divider">OR</div>
            <button type="button" class="btn-google" onclick="handleGoogleAuth()">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>

            <div class="toggle-link" onclick="switchView('signup')">
                New to Picxlart? <span>For Booking Please sign up</span>
            </div>
        </div>

        <!-- SIGNUP SECTION -->
        <div id="signup-section">
            <form id="signup-form">
                <div class="input-group">
                    <i class="fa-solid fa-user left-icon"></i>
                    <input type="text" id="signup-name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-phone left-icon"></i>
                    <input type="tel" id="signup-phone" placeholder="Phone Number" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-envelope left-icon"></i>
                    <input type="email" id="signup-email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock left-icon"></i>
                    <input type="password" id="signup-password" placeholder="Create Password" required>
                    <i class="fa-solid fa-eye right-icon" id="toggle-signup-pass" title="Show Password"></i>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock left-icon"></i>
                    <input type="password" id="signup-confirm" placeholder="Confirm Password" required>
                    <i class="fa-solid fa-eye right-icon" id="toggle-signup-confirm" title="Show Password"></i>
                </div>
                
                <button type="submit" class="btn-main" id="signup-submit-btn">
                    <span id="signup-btn-text">Create Account</span>
                    <div class="loader" id="signup-loader"></div>
                </button>
            </form>

            <div class="divider">OR</div>
            <button type="button" class="btn-google" onclick="handleGoogleAuth()">
                <i class="fa-brands fa-google"></i> Sign up with Google
            </button>

            <div class="toggle-link" onclick="switchView('login')">
                Already have an account? <span>Login Here</span>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGXrHusoIE1Alp9gqUDwCNg4mdba4s7uo",
            authDomain: "picxlart-portal.firebaseapp.com",
            projectId: "picxlart-portal",
            storageBucket: "picxlart-portal.firebasestorage.app",
            messagingSenderId: "993916901139",
            appId: "1:993916901139:web:55d481ca4cf6fb61fdece6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Eye Icon Toggle Function Helper (2 seconds auto-hide)
        function setupPasswordToggle(iconId, inputId) {
            const icon = document.getElementById(iconId);
            const input = document.getElementById(inputId);

            icon.addEventListener('click', function () {
                if (input.type === 'text') return;
                input.type = 'text';
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
                this.style.color = '#d4af37';

                setTimeout(() => {
                    input.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                    this.style.color = '#888';
                }, 2000);
            });
        }

        // Initialize Eye Toggles for Client Portal
        setupPasswordToggle('toggle-login-pass', 'login-password');
        setupPasswordToggle('toggle-signup-pass', 'signup-password');
        setupPasswordToggle('toggle-signup-confirm', 'signup-confirm');

        function switchView(view) {
            document.getElementById('global-msg').style.display = 'none';
            if(view === 'signup') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('signup-section').style.display = 'block';
                document.getElementById('form-title').innerText = "Client Registration";
                document.getElementById('form-subtitle').innerText = "Create an account for booking";
            } else {
                document.getElementById('signup-section').style.display = 'none';
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('form-title').innerText = "Client Login";
                document.getElementById('form-subtitle').innerText = "Login to track your project & payments";
            }
        }

        function showMsg(text, type) {
            const msgBox = document.getElementById('global-msg');
            msgBox.innerText = text;
            msgBox.className = type === 'error' ? 'msg-box msg-error' : 'msg-box msg-success';
            msgBox.style.display = 'block';
        }

        function resetLoginLoader() {
            document.getElementById('login-btn-text').style.display = 'block';
            document.getElementById('login-loader').style.display = 'none';
        }

        function routeUserWorkflow(user) {
            db.collection("users").doc(user.uid).get().then((doc) => {
                resetLoginLoader();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.status === "pending") {
                        auth.signOut().then(() => {
                            showMsg("Your account is pending admin approval. Please wait.", "error");
                        });
                    } else if (data.status === "approved") {
                        if (data.paperIssued === true) {
                            window.location.href = "client-dashboard.html";
                        } else if (data.formSubmitted === true) {
                            auth.signOut().then(() => {
                                showMsg("Thank you for submitting! Please wait for Admin to issue your Acknowledgement Paper.", "success");
                            });
                        } else {
                            window.location.href = "assignment-form.html";
                        }
                    } else {
                        auth.signOut().then(() => {
                            showMsg("Account status is invalid. Contact admin.", "error");
                        });
                    }
                } else {
                    auth.signOut().then(() => {
                        showMsg("Account data not found in database. Please register first.", "error");
                    });
                }
            }).catch((err) => {
                resetLoginLoader();
                auth.signOut();
                showMsg("Database error: " + err.message, "error");
            });
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            document.getElementById('login-btn-text').style.display = 'none';
            document.getElementById('login-loader').style.display = 'block';
            document.getElementById('global-msg').style.display = 'none';

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    routeUserWorkflow(userCredential.user);
                })
                .catch((error) => {
                    resetLoginLoader();
                    let errText = "Login failed.";
                    if(error.code === 'auth/user-not-found') errText = "No account found with this email.";
                    if(error.code === 'auth/wrong-password') errText = "Incorrect password.";
                    if(error.code === 'auth/invalid-email') errText = "Invalid email address.";
                    showMsg(errText, "error");
                });
        });

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const pass = document.getElementById('signup-password').value;
            const confirmPass = document.getElementById('signup-confirm').value;

            if (pass !== confirmPass) {
                showMsg("Passwords do not match!", "error");
                return;
            }

            document.getElementById('signup-btn-text').style.display = 'none';
            document.getElementById('signup-loader').style.display = 'block';
            document.getElementById('global-msg').style.display = 'none';

            auth.createUserWithEmailAndPassword(email, pass).then((userCredential) => {
                db.collection("users").doc(userCredential.user.uid).set({
                    name: name,
                    phone: phone,
                    email: email,
                    status: "pending",
                    formSubmitted: false,
                    paperIssued: false
                }).then(() => {
                    auth.signOut().then(() => {
                        document.getElementById('signup-btn-text').style.display = 'block';
                        document.getElementById('signup-loader').style.display = 'none';
                        switchView('login');
                        showMsg("Registration successful! Please wait for admin approval.", "success");
                    });
                });
            }).catch((error) => {
                document.getElementById('signup-btn-text').style.display = 'block';
                document.getElementById('signup-loader').style.display = 'none';
                showMsg(error.message, "error");
            });
        });

        function handleGoogleAuth() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                const user = result.user;
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        routeUserWorkflow(user);
                    } else {
                        db.collection("users").doc(user.uid).set({
                            name: user.displayName || "Google User",
                            email: user.email,
                            phone: "",
                            status: "pending",
                            formSubmitted: false,
                            paperIssued: false
                        }).then(() => {
                            auth.signOut().then(() => {
                                switchView('login');
                                showMsg("Registration successful! Please wait for admin approval.", "success");
                            });
                        });
                    }
                });
            }).catch((error) => {
                showMsg("Google login failed: " + error.message, "error");
            });
        }
    </script>
</body>
</html>
