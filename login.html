<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Access - Picxlart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK Integration -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0d0d0d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: #18181c; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 16px; width: 100%; max-width: 400px; padding: 35px 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .logo-img { height: 50px; margin-bottom: 15px; }
        .status-msg { display: none; background: rgba(212, 175, 55, 0.15); border: 1px solid #d4af37; color: #f4d06f; padding: 12px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; text-align: left; line-height: 1.5; }
        .btn-google { width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; margin-bottom: 15px; }
        .divider { color: #666; font-size: 11px; margin: 15px 0; }
        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px 12px; background: #0f0f11; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 12px; outline: none; }
        .form-group input:focus { border-color: #d4af37; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #d4af37, #aa820a); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; margin-top: 10px; }
        .switch-link { color: #d4af37; text-decoration: none; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="auth-card">
        <img src="logo.png" alt="Picxlart" class="logo-img">
        <h4 style="color:#aaa; font-size:13px; font-weight:400; margin-bottom:20px;" id="portal-title">Create Your Client Account</h4>

        <div id="status-box" class="status-msg"></div>

        <button class="btn-google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="height:18px;"> Continue with Google
        </button>

        <div class="divider">OR</div>

        <div class="form-group" id="name-group">
            <label>Full Name</label>
            <input type="text" id="client-name" placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="client-email" placeholder="example@gmail.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="client-pass" placeholder="••••••••">
        </div>

        <button class="btn-submit" id="main-btn" onclick="handleAuth()">Sign Up</button>

        <p style="font-size:12px; color:#888; margin-top:15px;" id="toggle-text">
            Already have an account? <span class="switch-link" onclick="toggleAuthMode()">Login</span>
        </p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGXrHusoIE1Alp9gqUDwCNg4mdba4s7uo",
            authDomain: "picxlart-portal.firebaseapp.com",
            projectId: "picxlart-portal",
            storageBucket: "picxlart-portal.firebasestorage.app",
            messagingSenderId: "993916901139",
            appId: "1:993916901139:web:55d481ca4cf6fb61fdece6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isSignUp = true;

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('name-group').style.display = isSignUp ? 'block' : 'none';
            document.getElementById('portal-title').innerText = isSignUp ? 'Create Your Client Account' : 'Client Portal Login';
            document.getElementById('main-btn').innerText = isSignUp ? 'Sign Up' : 'Login';
            document.getElementById('toggle-text').innerHTML = isSignUp ? 
                'Already have an account? <span class="switch-link" onclick="toggleAuthMode()">Login</span>' : 
                'Don\'t have an account? <span class="switch-link" onclick="toggleAuthMode()">Sign Up</span>';
        }

        function showStatus(msg) {
            const box = document.getElementById('status-box');
            box.style.display = 'block';
            box.innerText = msg;
        }

        // Google Login Logic with Mandatory DB Write
        async function loginWithGoogle() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                await processUserApproval(user.uid, user.displayName, user.email);
            } catch (error) {
                showStatus("Google Login Error: " + error.message);
            }
        }

        // Email / Password Logic
        async function handleAuth() {
            const email = document.getElementById('client-email').value.trim();
            const pass = document.getElementById('client-pass').value;
            const name = document.getElementById('client-name').value.trim();

            if(!email || !pass) { alert("Please enter email and password!"); return; }

            try {
                if(isSignUp) {
                    if(!name) { alert("Please enter your full name!"); return; }
                    const cred = await auth.createUserWithEmailAndPassword(email, pass);
                    await processUserApproval(cred.user.uid, name, email);
                } else {
                    const cred = await auth.signInWithEmailAndPassword(email, pass);
                    await processUserApproval(cred.user.uid, "", email);
                }
            } catch (err) {
                if (err.code === 'auth/email-already-in-use') {
                    showStatus("This email is already registered. Please click 'Login' below.");
                } else {
                    showStatus("Error: " + err.message);
                }
            }
        }

        // Check or Set Pending Status in Database
        async function processUserApproval(uid, name, email) {
            const userRef = db.collection("users").doc(uid);
            const doc = await userRef.get();

            if (!doc.exists) {
                // First time user -> Save as Pending
                await userRef.set({
                    name: name || email.split('@')[0],
                    email: email,
                    status: "pending",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showStatus("Your account is pending admin approval. Please wait for confirmation.");
            } else {
                const data = doc.data();
                if (data.status === "approved") {
                    window.location.href = "assignment-form.html";
                } else {
                    showStatus("Your account is pending admin approval. Please wait for confirmation.");
                }
            }
        }
    </script>
</body>
</html>
