<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login - Picxlart Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #0b0b0d; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-image: radial-gradient(circle at top right, #1a1a24, #0b0b0d);
        }

        .login-container {
            background: #121215;
            border: 1px solid #d4af37;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
        }

        .login-container img { height: 60px; margin-bottom: 10px; }
        
        .login-container h2 {
            color: #d4af37;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .login-container p {
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group i.left-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #d4af37;
            font-size: 14px;
        }

        .input-group i.right-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color: #888;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .input-group i.right-icon:hover { color: #fff; }

        .input-group input {
            width: 100%;
            padding: 14px 40px 14px 40px; /* Space for both left and right icons */
            background: #0d0d0f;
            border: 1px solid #2a2a30;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .divider {
            margin: 20px 0;
            color: #555;
            font-size: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .divider::before, .divider::after {
            content: "";
            height: 1px;
            background: #2a2a30;
            flex: 1;
            margin: 0 10px;
        }

        .btn-google {
            width: 100%;
            background: #ffffff;
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-google:hover { background: #e0e0e0; }
        .btn-google i { color: #ea4335; font-size: 18px; }

        .error-msg {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 15px;
            display: none;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ff4d4d;
        }

        .signup-link {
            display: block;
            margin-top: 25px;
            font-size: 13px;
            color: #aaa;
            text-decoration: none;
            transition: 0.3s;
        }
        
        .signup-link span { color: #d4af37; font-weight: 600; }
        .signup-link:hover span { text-decoration: underline; }

        /* Loader */
        .loader { display: none; width: 18px; height: 18px; border: 3px solid rgba(0,0,0,0.3); border-top-color: #000; border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="logo.png" alt="Picxlart Logo">
        <h2>Client Portal</h2>
        <p>Login to track your project & payments</p>

        <form id="login-form">
            <div class="input-group">
                <i class="fa-solid fa-envelope left-icon"></i>
                <input type="email" id="email" placeholder="Registered Email Address" required>
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-lock left-icon"></i>
                <input type="password" id="password" placeholder="Password" required>
                <!-- Smart Eye Icon Toggle -->
                <i class="fa-solid fa-eye right-icon" id="toggle-password" title="Show Password"></i>
            </div>

            <div id="error-message" class="error-msg"></div>

            <button type="submit" class="btn-login" id="login-btn">
                <span id="btn-text">Secure Login</span>
                <div class="loader" id="btn-loader"></div>
            </button>
        </form>

        <div class="divider">OR</div>

        <button type="button" class="btn-google" id="google-login-btn">
            <i class="fa-brands fa-google"></i> Continue with Google
        </button>

        <a href="assignment-form.html" class="signup-link">New to Picxlart? <span>Fill Assignment Form</span></a>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAGXrHusoIE1Alp9gqUDwCNg4mdba4s7uo",
            authDomain: "picxlart-portal.firebaseapp.com",
            projectId: "picxlart-portal",
            storageBucket: "picxlart-portal.firebasestorage.app",
            messagingSenderId: "993916901139",
            appId: "1:993916901139:web:55d481ca4cf6fb61fdece6"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Check if already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "client-dashboard.html";
            }
        });

        const loginForm = document.getElementById('login-form');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');
        const errorMsg = document.getElementById('error-message');

        // 1. Password Visibility Logic (2 Seconds Timer)
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        togglePasswordBtn.addEventListener('click', function () {
            // If it's already text, ignore click (prevents overlapping timers)
            if (passwordInput.type === 'text') return;

            // Show password and change icon
            passwordInput.type = 'text';
            this.classList.remove('fa-eye');
            this.classList.add('fa-eye-slash');
            this.style.color = '#d4af37'; // Highlight icon in gold when visible

            // Hide automatically after 2 seconds (2000ms)
            setTimeout(() => {
                passwordInput.type = 'password';
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
                this.style.color = '#888'; // Revert color
            }, 2000);
        });

        // 2. Email/Password Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            // UI Loading state
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            errorMsg.style.display = 'none';

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Success! Auth listener will auto-redirect
                })
                .catch((error) => {
                    btnText.style.display = 'block';
                    btnLoader.style.display = 'none';
                    
                    let errorMessage = "Failed to login. Please try again.";
                    if(error.code === 'auth/user-not-found') errorMessage = "No client found with this email.";
                    if(error.code === 'auth/wrong-password') errorMessage = "Incorrect password.";
                    if(error.code === 'auth/too-many-requests') errorMessage = "Too many attempts. Try again later.";
                    
                    errorMsg.innerText = errorMessage;
                    errorMsg.style.display = 'block';
                });
        });

        // 3. Google Sign-In Logic
        const googleBtn = document.getElementById('google-login-btn');
        googleBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    // Success! Auth listener will auto-redirect
                })
                .catch((error) => {
                    errorMsg.innerText = "Google login failed: " + error.message;
                    errorMsg.style.display = 'block';
                });
        });
    </script>
</body>
</html>
