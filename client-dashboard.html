<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Dashboard - Picxlart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0b0b0d; color: #fff; padding: 30px 15px; }
        .container { max-width: 850px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #222228; padding-bottom: 20px; }
        .header img { height: 55px; margin-bottom: 8px; }
        .header h2 { color: #d4af37; font-size: 22px; font-weight: 600; }
        
        .btn-download-pdf { width: 100%; background: linear-gradient(135deg, #d4af37, #aa820a); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 25px; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }

        .card { background: #141417; border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 14px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card-title { color: #d4af37; font-size: 15px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        .payment-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 15px; }
        .pay-card { background: #0a0a0c; border: 1px solid #2a2a30; border-radius: 10px; padding: 16px; }
        .pay-card-title { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; margin-bottom: 8px; }
        .pay-card-value { font-size: 19px; font-weight: 700; color: #fff; }
        
        .pay-card.total { border-color: rgba(212, 175, 55, 0.4); } .pay-card.total .pay-card-value { color: #d4af37; }
        .pay-card.paid { border-color: rgba(76, 175, 80, 0.4); } .pay-card.paid .pay-card-value { color: #4caf50; }
        .pay-card.early-due { border-color: rgba(255, 152, 0, 0.4); } .pay-card.early-due .pay-card-value { color: #ff9800; }
        .pay-card.event-due { border-color: rgba(33, 150, 243, 0.4); } .pay-card.event-due .pay-card-value { color: #2196F3; }
        .pay-card.delivery-due { border-color: rgba(233, 30, 99, 0.4); } .pay-card.delivery-due .pay-card-value { color: #e91e63; }

        .stage-item { display: flex; justify-content: space-between; align-items: center; background: #0a0a0c; padding: 14px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #222; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; display: none; justify-content: center; align-items: center; padding: 20px; }
        .preview-box { background: #1a1a1e; border: 1px solid #d4af37; color: #fff; border-radius: 12px; width: 100%; max-width: 900px; height: 95vh; overflow-y: auto; padding: 25px; position: relative; }

        .pdf-page-wrap { position: relative; width: 100%; max-width: 794px; margin: 0 auto 30px auto; border: 1px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .pdf-page-bg { width: 100%; display: block; }
        .pdf-data-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Picxlart Logo">
            <h2>Welcome, <span id="client-display-name">Client</span></h2>
            <p style="color:#888; font-size:12px;">Picxlart Official Assignment & Booking Tracking Portal</p>
        </div>

        <button class="btn-download-pdf" onclick="openClientPdf()"><i class="fa-solid fa-file-pdf"></i> View & Print Official 6-Page Acknowledgement Paper</button>

        <div class="card">
            <div class="card-title"><i class="fa-solid fa-calculator"></i> My Payment & Dues Breakdown</div>
            <div class="payment-summary-grid">
                <div class="pay-card total">
                    <div class="pay-card-title">Total Package Value</div>
                    <div class="pay-card-value" id="client-total">₹0</div>
                </div>
                <div class="pay-card paid">
                    <div class="pay-card-title">Advance Paid</div>
                    <div class="pay-card-value" id="client-adv">₹0</div>
                </div>
                <div class="pay-card early-due" id="c-card-early" style="display:none;">
                    <div class="pay-card-title">1 Month Before Due (50%)</div>
                    <div class="pay-card-value" id="client-early-due">₹0</div>
                </div>
                <div class="pay-card event-due">
                    <div class="pay-card-title">Event Day Final Due</div>
                    <div class="pay-card-value" id="client-event-due">₹0</div>
                </div>
                <div class="pay-card delivery-due" id="c-card-deliv" style="display:none;">
                    <div class="pay-card-title">Album/Deliverable Submission Due</div>
                    <div class="pay-card-value" id="client-deliv-due">₹0</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fa-solid fa-list-check"></i> Live Event / Shoot Progress Status</div>
            <div id="client-stages-box">
                <p style="color:#777; font-size:12px;">Loading project status...</p>
            </div>
        </div>
    </div>

    <!-- PDF VIEW MODAL FOR CLIENT -->
    <div class="modal-overlay" id="client-pdf-modal">
        <div class="preview-box">
            <span style="position:absolute; top:15px; right:20px; font-size:24px; cursor:pointer;" onclick="document.getElementById('client-pdf-modal').style.display='none'">&times;</span>
            <div id="pdf-render-area"></div>
            <button onclick="window.print()" style="margin-top:20px; width:100%; background:#2196F3; color:#fff; border:none; padding:12px; border-radius:6px; font-weight:600; cursor:pointer;"><i class="fa-solid fa-print"></i> Print / Download Official 6-Page PDF</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGXrHusoIE1Alp9gqUDwCNg4mdba4s7uo",
            authDomain: "picxlart-portal.firebaseapp.com",
            projectId: "picxlart-portal",
            storageBucket: "picxlart-portal.firebasestorage.app",
            messagingSenderId: "993916901139",
            appId: "1:993916901139:web:55d481ca4cf6fb61fdece6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let clientDataStore = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.collection("users").doc(user.uid).onSnapshot((doc) => {
                    if (doc.exists) {
                        clientDataStore = doc.data();

                        if (!clientDataStore.paperIssued) {
                            window.location.href = "assignment-form.html";
                            return;
                        }

                        document.getElementById('client-display-name').innerText = clientDataStore.name || "Client";

                        if(clientDataStore.customPayments) {
                            document.getElementById('client-total').innerText = '₹' + clientDataStore.customPayments.total;
                            document.getElementById('client-adv').innerText = '₹' + clientDataStore.customPayments.adv;
                            document.getElementById('client-early-due').innerText = '₹' + clientDataStore.customPayments.earlyDue;
                            document.getElementById('client-event-due').innerText = '₹' + clientDataStore.customPayments.eventDue;
                            document.getElementById('client-deliv-due').innerText = '₹' + clientDataStore.customPayments.deliveryDue;

                            document.getElementById('c-card-early').style.display = clientDataStore.customPayments.earlyDue > 0 ? 'block' : 'none';
                            document.getElementById('c-card-deliv').style.display = clientDataStore.customPayments.deliveryDue > 0 ? 'block' : 'none';
                        } else {
                            const total = parseFloat(clientDataStore.totalAmount) || parseFloat(clientDataStore.totalPkgAmt) || 0;
                            const adv = parseFloat(clientDataStore.advanceAmount) || parseFloat(clientDataStore.advanceAmt) || 0;
                            const req50Adv = total * 0.50;

                            document.getElementById('client-total').innerText = '₹' + total;
                            document.getElementById('client-adv').innerText = '₹' + adv;

                            let earlyDue = 0;
                            if (adv < req50Adv) {
                                earlyDue = req50Adv - adv;
                                document.getElementById('c-card-early').style.display = 'block';
                                document.getElementById('client-early-due').innerText = '₹' + earlyDue;
                            } else {
                                document.getElementById('c-card-early').style.display = 'none';
                            }

                            const duesRaw = (clientDataStore.duesAfterAssignment || "").toUpperCase().trim();
                            let deliveryDue = 0;

                            if (!duesRaw.includes("NO DUES") && duesRaw !== "") {
                                if(duesRaw.includes("K")) {
                                    const matchK = duesRaw.match(/(\d+)\s*K/);
                                    if(matchK) deliveryDue = parseFloat(matchK[1]) * 1000;
                                } 
                                if(deliveryDue === 0) {
                                    const matches = duesRaw.match(/\d+/g);
                                    if(matches) deliveryDue = parseFloat(matches.join(''));
                                }
                                if(deliveryDue === 0) deliveryDue = 5000;
                            }

                            const eventDue = total - (adv + earlyDue + deliveryDue);
                            document.getElementById('client-event-due').innerText = '₹' + Math.max(0, eventDue);

                            if(deliveryDue > 0) {
                                document.getElementById('c-card-deliv').style.display = 'block';
                                document.getElementById('client-deliv-due').innerText = '₹' + deliveryDue;
                            } else {
                                document.getElementById('c-card-deliv').style.display = 'none';
                            }
                        }

                        const stagesBox = document.getElementById('client-stages-box');
                        stagesBox.innerHTML = "";
                        const stages = clientDataStore.projectStages || [];

                        if(stages.length === 0) {
                            stagesBox.innerHTML = `<p style="color:#888; font-size:12px;">Your event shoot stages will be updated here shortly by Admin.</p>`;
                        } else {
                            stages.forEach(stg => {
                                const badgeColor = stg.completed ? '#4caf50' : '#ff9800';
                                const badgeText = stg.completed ? '✅ Completed' : '⏳ In Progress';
                                stagesBox.innerHTML += `
                                    <div class="stage-item">
                                        <span style="font-size:13px; font-weight:500;">${stg.name}</span>
                                        <span style="color:${badgeColor}; font-size:12px; font-weight:600;">${badgeText}</span>
                                    </div>
                                `;
                            });
                        }
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        function openClientPdf() {
            if(!clientDataStore) return;

            const clientName = clientDataStore.name || '';

            const area = document.getElementById('pdf-render-area');
            area.innerHTML = `
                <!-- PAGE 1 -->
                <div class="pdf-page-wrap"><img src="acknowledgement-page1.jpg" class="pdf-page-bg"></div>

                <!-- PAGE 2 -->
                <div class="pdf-page-wrap">
                    <img src="acknowledgement-page2.jpg" class="pdf-page-bg">
                    <div class="pdf-data-overlay">
                        <div style="position:absolute; top:30.2%; left:18.8%; font-size:16px; font-weight:600; color:#aa820a; font-family:'Times New Roman', serif;">${clientName}</div>
                        <div style="position:absolute; top:39.0%; left:20.8%; font-size:16px; font-weight:700; color:#000000; font-family:'Times New Roman', serif;">${clientName}</div>
                    </div>
                </div>

                <!-- PAGE 3 -->
                <div class="pdf-page-wrap">
                    <img src="acknowledgement-page3.jpg" class="pdf-page-bg">
                    <div class="pdf-data-overlay" style="font-size:11px; font-weight:bold; font-family:Arial, sans-serif; color:#000;">
                        <div style="position:absolute; top:13.2%; left:40.0%;">${clientDataStore.email || ''}</div>
                        <div style="position:absolute; top:15.5%; left:22.5%;">${clientDataStore.eventType || ''}</div>
                        <div style="position:absolute; top:17.8%; left:29.5%;">${clientDataStore.name || ''}</div>
                        <div style="position:absolute; top:20.1%; left:28.0%; width:65%;">${clientDataStore.address || ''}</div>
                        <div style="position:absolute; top:22.4%; left:22.0%;">${clientDataStore.phone || ''}</div>
                        <div style="position:absolute; top:24.7%; left:24.0%;">${clientDataStore.whatsapp || ''}</div>
                        <div style="position:absolute; top:27.0%; left:18.5%;">${clientDataStore.email || ''}</div>
                        <div style="position:absolute; top:29.3%; left:56.0%; width:40%;">${clientDataStore.assignmentBriefDate || ''}</div>
                        
                        <div style="position:absolute; top:33.8%; left:24.0%;">${clientDataStore.bookingDate || ''}</div>
                        <div style="position:absolute; top:36.1%; left:16.0%;">${clientDataStore.daysCount || ''}</div>
                        <div style="position:absolute; top:38.4%; left:47.0%;">${clientDataStore.weddingCategory || ''}</div>
                        <div style="position:absolute; top:40.7%; left:68.0%;">${clientDataStore.otherWeddingCategory || 'NO'}</div>
                        <div style="position:absolute; top:43.0%; left:65.0%;">${clientDataStore.complimentaryAssured || 'NO'}</div>
                        <div style="position:absolute; top:45.3%; left:50.0%;">${clientDataStore.complimentaryDetails || 'NO'}</div>
                        <div style="position:absolute; top:47.6%; left:52.0%;">${clientDataStore.weddingLagna || ''}</div>
                        <div style="position:absolute; top:49.9%; left:61.5%;">${clientDataStore.packageNameAndCost || ''}</div>

                        <div style="position:absolute; top:54.4%; left:46.0%;">₹${clientDataStore.totalAmount || '0'}</div>
                        <div style="position:absolute; top:56.7%; left:28.0%;">₹${clientDataStore.advanceAmount || '0'}</div>
                        <div style="position:absolute; top:59.0%; left:86.0%;">₹${clientDataStore.tokenBooking || '0'}</div>
                        <div style="position:absolute; top:61.3%; left:72.0%; width:25%;">${clientDataStore.finalPaymentDesc || 'Rest all payment'}</div>
                        <div style="position:absolute; top:63.6%; left:93.5%;">${clientDataStore.duesAfterAssignment || 'NO DUES'}</div>
                        <div style="position:absolute; top:65.9%; left:22.0%; width:70%;">${clientDataStore.jobDetails || ''}</div>

                        <div style="position:absolute; top:70.4%; left:39.5%;">${clientDataStore.albumDetails || ''}</div>
                        <div style="position:absolute; top:72.7%; left:51.5%;">${clientDataStore.customRequirements || 'NIL'}</div>
                        <div style="position:absolute; top:75.0%; left:43.0%;">${clientDataStore.miscCharges || 'NIL'}</div>
                        <div style="position:absolute; top:77.3%; left:32.0%;">${clientDataStore.droneRequired || 'NIL'}</div>
                    </div>
                </div>

                <!-- PAGE 4 -->
                <div class="pdf-page-wrap">
                    <img src="acknowledgement-page4.jpg" class="pdf-page-bg">
                    <div class="pdf-data-overlay" style="font-size:11px; font-weight:bold; font-family:Arial, sans-serif; color:#000;">
                        <div style="position:absolute; top:81.2%; left:32.0%; width:60%;">${clientDataStore.comments || 'NIL'}</div>
                        <div style="position:absolute; top:83.8%; left:72.0%; font-size:12px; font-weight:bold; font-family:Arial, sans-serif; color:#000;">Team Picxlart</div>
                    </div>
                </div>

                <!-- PAGE 5 -->
                <div class="pdf-page-wrap">
                    <img src="acknowledgement-page5.jpg" class="pdf-page-bg">
                    <div class="pdf-data-overlay" style="font-size:11px; font-weight:bold; font-family:Arial, sans-serif; color:#000;">
                        <div style="position:absolute; top:9.5%; left:21.0%;">${clientDataStore.packageNameAndCost || ''}</div>
                        <div style="position:absolute; top:13.2%; left:32.0%;">₹${clientDataStore.totalAmount || '0'}</div>
                        <div style="position:absolute; top:15.0%; left:19.0%;">${clientDataStore.daysCount || '1 Day'}</div>
                        <div style="position:absolute; top:17.0%; left:43.0%; width:50%;">${clientDataStore.jobDetails || ''}</div>

                        <div style="position:absolute; top:48.0%; left:29.0%;">₹${clientDataStore.totalAmount || '0'}</div>
                        <div style="position:absolute; top:50.0%; left:31.0%;">₹${clientDataStore.totalAmount || '0'}</div>
                        <div style="position:absolute; top:52.0%; left:21.0%;">₹${clientDataStore.advanceAmount || '0'}</div>
                        <div style="position:absolute; top:54.0%; left:25.0%;">₹${clientDataStore.tokenBooking || '0'}</div>
                        <div style="position:absolute; top:56.0%; left:43.0%;">₹${(parseFloat(clientDataStore.totalAmount || 0) - parseFloat(clientDataStore.advanceAmount || 0))}</div>
                    </div>
                </div>

                <!-- PAGE 6 -->
                <div class="pdf-page-wrap"><img src="acknowledgement-page6.jpg" class="pdf-page-bg"></div>
            `;
            document.getElementById('client-pdf-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
