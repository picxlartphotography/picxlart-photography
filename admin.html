<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Picxlart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0b0d; color: #ffffff; min-height: 100vh; }

        /* Lock Screen Styling */
        #auth-lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0b0d;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            background-image: radial-gradient(circle at top right, #1a1a24, #0b0b0d);
        }

        .lock-container {
            background: #121215;
            border: 1px solid #d4af37;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }

        .lock-container img { height: 55px; margin-bottom: 10px; }
        .lock-container h2 { color: #d4af37; font-size: 22px; font-weight: 600; margin-bottom: 20px; }

        .input-group { position: relative; margin-bottom: 16px; text-align: left; }
        .input-group i.left-icon { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #d4af37; font-size: 14px; }
        .input-group i.right-icon { position: absolute; top: 50%; right: 15px; transform: translateY(-50%); color: #888; font-size: 14px; cursor: pointer; transition: color 0.3s; }
        .input-group i.right-icon:hover { color: #fff; }
        
        .input-group input { width: 100%; padding: 13px 40px 13px 40px; background: #0d0d0f; border: 1px solid #2a2a30; border-radius: 8px; color: #fff; font-size: 13px; transition: 0.3s; }
        .input-group input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); }

        .btn-unlock { width: 100%; background: linear-gradient(135deg, #d4af37, #aa820a); color: #000; border: none; padding: 13px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn-unlock:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3); }

        .error-msg { color: #ff4d4d; font-size: 12px; margin-top: 15px; display: none; background: rgba(255, 77, 77, 0.1); padding: 8px; border-radius: 6px; border: 1px solid #ff4d4d; }

        /* Dashboard Layout */
        #admin-dashboard { display: none; padding: 30px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 30px; }
        .admin-header h1 { color: #d4af37; font-size: 22px; }
        .btn-logout { background: #ff4d4d; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }

        .section-title { font-size: 18px; color: #d4af37; margin-bottom: 15px; }
        .table-container { background: #121215; border: 1px solid #2a2a30; border-radius: 10px; overflow: hidden; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #222; }
        th { background: #1a1a20; color: #d4af37; }
        
        .btn-action { padding: 6px 12px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 11px; margin-right: 5px; }
        .btn-approve { background: #4caf50; color: #fff; }
        .btn-view { background: #d4af37; color: #000; }
    </style>
</head>
<body>

    <!-- ADMIN LOCK SCREEN -->
    <div id="auth-lock-screen">
        <div class="lock-container">
            <img src="logo.png" alt="Picxlart Logo">
            <h2>Admin Access Lock</h2>
            <form id="admin-login-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope left-icon"></i>
                    <input type="email" id="admin-email" placeholder="Admin Email" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock left-icon"></i>
                    <input type="password" id="admin-password" placeholder="Password" required>
                    <i class="fa-solid fa-eye right-icon" id="toggle-admin-password" title="Show Password"></i>
                </div>
                <div id="admin-error" class="error-msg"></div>
                <button type="submit" class="btn-unlock">Unlock Dashboard</button>
            </form>
        </div>
    </div>

    <!-- ADMIN DASHBOARD CONTENT -->
    <div id="admin-dashboard">
        <div class="admin-header">
            <h1>PICXLART CLIENT MANAGEMENT SYSTEM (ADMIN)</h1>
            <button class="btn-logout" onclick="adminLogout()">Logout</button>
        </div>

        <h2 class="section-title">Pending Signup Requests</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Client Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pending-table-body">
                    <tr><td colspan="4" style="text-align: center; color: #777;">Loading requests...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGXrHusoIE1Alp9gqUDwCNg4mdba4s7uo",
            authDomain: "picxlart-portal.firebaseapp.com",
            projectId: "picxlart-portal",
            storageBucket: "picxlart-portal.firebasestorage.app",
            messagingSenderId: "993916901139",
            appId: "1:993916901139:web:55d481ca4cf6fb61fdece6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Eye Icon Toggle Logic for Admin
        const toggleAdminPass = document.getElementById('toggle-admin-password');
        const adminPassInput = document.getElementById('admin-password');

        toggleAdminPass.addEventListener('click', function () {
            if (adminPassInput.type === 'text') return;
            adminPassInput.type = 'text';
            this.classList.remove('fa-eye');
            this.classList.add('fa-eye-slash');
            this.style.color = '#d4af37';

            setTimeout(() => {
                adminPassInput.type = 'password';
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
                this.style.color = '#888';
            }, 2000);
        });

        // Load Pending Users
        function loadPendingUsers() {
            const tbody = document.getElementById('pending-table-body');
            db.collection("users").where("status", "==", "pending").onSnapshot((snapshot) => {
                tbody.innerHTML = "";
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #777;">No pending requests found.</td></tr>`;
                    return;
                }
                snapshot.forEach((doc) => {
                    const user = doc.data();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.name || 'N/A'}</td>
                        <td>${user.email || 'N/A'}</td>
                        <td>${user.phone || 'N/A'}</td>
                        <td>
                            <button class="btn-action btn-approve" onclick="approveUser('${doc.id}')">Approve</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        window.approveUser = function(userId) {
            db.collection("users").doc(userId).update({
                status: "approved"
            }).then(() => {
                alert("Client approved successfully!");
            }).catch((err) => {
                alert("Error: " + err.message);
            });
        }

        window.adminLogout = function() {
            auth.signOut();
        }

        // Auth State Handler
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-lock-screen').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                loadPendingUsers();
            } else {
                document.getElementById('auth-lock-screen').style.display = 'flex';
                document.getElementById('admin-dashboard').style.display = 'none';
            }
        });

        document.getElementById('admin-login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = adminPassInput.value;
            const errBox = document.getElementById('admin-error');

            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    errBox.innerText = "Access Denied: " + error.message;
                    errBox.style.display = 'block';
                });
        });
    </script>
</body>
</html>
