<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Form - Picxlart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0d0d0d; color: #fff; padding: 40px 20px; }
        .form-card { background: #18181c; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; width: 100%; max-width: 600px; margin: 0 auto; padding: 30px; }
        h2 { color: #d4af37; text-align: center; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #0f0f11; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #d4af37; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #d4af37, #aa820a); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .success-box { display: none; text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>

    <div class="form-card" id="form-container">
        <h2>Assignment Details Form</h2>
        <div class="form-group"><label>Event Category / Type</label><input type="text" id="event-type" placeholder="e.g. Wedding, Rice Ceremony"></div>
        <div class="form-group"><label>Event Date</label><input type="date" id="event-date"></div>
        <div class="form-group"><label>Contact / WhatsApp No</label><input type="text" id="phone-no" placeholder="+91..."></div>
        <div class="form-group"><label>Full Address</label><textarea id="address" rows="2" placeholder="Venue Address"></textarea></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group"><label>Total Package Amount (₹)</label><input type="number" id="total-amount"></div>
            <div class="form-group"><label>Advance Paid (₹)</label><input type="number" id="advance-amount"></div>
        </div>
        <div class="form-group"><label>Job Details / Specific Requirements</label><textarea id="job-details" rows="3" placeholder="Cinematography, Candid, etc..."></textarea></div>
        
        <button class="btn-submit" onclick="submitForm()">Submit Assignment Details</button>
    </div>

    <div class="form-card success-box" id="success-container">
        <h1 style="color:#4caf50; font-size: 50px; margin-bottom:10px;">✔</h1>
        <h3 style="color:#fff;">Assignment Submitted Successfully!</h3>
        <p style="color:#aaa; font-size: 13px; margin-top: 10px;">Thank you! Your details have been recorded. Please wait while Admin reviews your details and issues your Acknowledgement Paper.</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGXrHusoIE1Alp9gqUDwCNg4mdba4s7uo",
            authDomain: "picxlart-portal.firebaseapp.com",
            projectId: "picxlart-portal",
            storageBucket: "picxlart-portal.firebasestorage.app",
            messagingSenderId: "993916901139",
            appId: "1:993916901139:web:55d481ca4cf6fb61fdece6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUserUid = null;

        // Verify if user is logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserUid = user.uid;
                // If form already submitted previously, show success directly
                db.collection("users").doc(currentUserUid).get().then(doc => {
                    if(doc.exists && doc.data().formSubmitted) {
                        document.getElementById('form-container').style.display = 'none';
                        document.getElementById('success-container').style.display = 'block';
                    }
                });
            } else {
                window.location.href = "login.html"; // Block direct access without login
            }
        });

        function submitForm() {
            if(!currentUserUid) { alert("Security Error! Please login again."); return; }

            const eventType = document.getElementById('event-type').value;
            const eventDate = document.getElementById('event-date').value;
            const phoneNo = document.getElementById('phone-no').value;
            const address = document.getElementById('address').value;
            const totalAmount = document.getElementById('total-amount').value || '0';
            const advanceAmount = document.getElementById('advance-amount').value || '0';
            const jobDetails = document.getElementById('job-details').value;

            if(!eventType || !eventDate || !phoneNo) {
                alert("Please fill in Event Type, Date, and Phone Number!");
                return;
            }

            // Save details to the SAME 'users' database for Admin panel to read
            db.collection("users").doc(currentUserUid).update({
                eventType: eventType,
                eventDate: eventDate,
                phone: phoneNo,
                address: address,
                totalAmount: totalAmount,
                advanceAmount: advanceAmount,
                jobDetails: jobDetails,
                formSubmitted: true,
                submittedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('form-container').style.display = 'none';
                document.getElementById('success-container').style.display = 'block';
            }).catch((error) => {
                alert("Error saving form: " + error.message);
            });
        }
    </script>
</body>
</html>
